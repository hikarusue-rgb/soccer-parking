function fmtDate(iso){if(!iso)return"";return new Date(iso).toLocaleDateString("ja-JP",{month:"short",day:"numeric",weekday:"short"})}
function fmtDateTime(iso){if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString("ja-JP",{month:"short",day:"numeric",weekday:"short"})+" "+d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}
function getTimeLeft(dl){const d=new Date(dl)-new Date();if(d<=0)return null;const h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000);if(h>=24)return`${Math.floor(h/24)}日後`;if(h>0)return`${h}時間${m}分`;return`${m}分`}
function getEventRoster(roster,ev){const g=ev.inviteGrades||[...new Set(roster.map(r=>r.grade||"4年"))];return roster.filter(r=>g.includes(r.grade||"4年"))}
function getConfirmed(ev){return ev.confirmedParking||[]}
function getLotterySlots(ev){return Math.max(0,(ev.parkingLimit||0)-getConfirmed(ev).length)}
function getDropouts(ev,resp,lott){
  if(!lott?.conducted)return null;
  const winners=lott.winners||[];
  const dropouts=winners.filter(id=>{const r=resp[id];return !r||!r.attending||!r.parkingNeeded});
  const effectiveWinners=winners.filter(id=>!dropouts.includes(id));
  const openSlots=Math.max(0,getLotterySlots(ev)-effectiveWinners.length);
  const allParticipants=lott.allParticipants||[];
  const eligibleLosers=allParticipants.filter(id=>{
    if(winners.includes(id))return false;
    const r=resp[id];
    return r&&r.attending&&r.parkingNeeded;
  });
  return{dropouts,effectiveWinners,openSlots,eligibleLosers};
}
function computeCarpoolMatching(ev,resp,lott){
  if(!ev?.carpoolEnabled||!lott?.conducted)return null;
  const confirmed=getConfirmed(ev);
  const winners=lott.winners||[];
  const drivers=[...confirmed,...winners].map(id=>{
    const r=resp[id];
    if(!r||!r.attending)return null;
    if(!r.carpoolCapacity||r.carpoolCapacity<=0)return null;
    return{id,meetingPoint:(r.meetingPoint||"").trim(),capacity:r.carpoolCapacity};
  }).filter(d=>d&&d.meetingPoint);
  const allParts=lott.allParticipants||[];
  const losers=allParts.filter(id=>!winners.includes(id)&&!confirmed.includes(id)).filter(id=>{const r=resp[id];return r&&r.attending&&r.parkingNeeded});
  const points={};
  drivers.forEach(d=>{
    if(!points[d.meetingPoint])points[d.meetingPoint]={drivers:[],riders:[],totalCapacity:0};
    points[d.meetingPoint].drivers.push(d);
    points[d.meetingPoint].totalCapacity+=d.capacity;
  });
  losers.forEach(id=>{
    const r=resp[id];
    const wishes=(r.carpoolWishes||[]).filter(Boolean);
    wishes.forEach(w=>{
      const key=w.trim();
      if(points[key]){points[key].riders.push({id,wishes})}
    });
  });
  const assignments=(lott.carpoolAssignments)||{};
  const result=[];
  Object.entries(points).forEach(([mp,data])=>{
    if(data.riders.length===0)return;
    const uniqueRiders=[...new Map(data.riders.map(r=>[r.id,r])).values()];
    const overflow=uniqueRiders.length>data.totalCapacity;
    let assigned=assignments[mp]||null;
    if(!overflow&&!assigned){assigned=uniqueRiders.map(r=>r.id)}
    result.push({meetingPoint:mp,drivers:data.drivers,totalCapacity:data.totalCapacity,riders:uniqueRiders,overflow,assigned});
  });
  const unmatched=losers.filter(id=>{
    const r=resp[id];
    const wishes=(r.carpoolWishes||[]).filter(Boolean);
    if(wishes.length===0)return false;
    return !wishes.some(w=>{const k=w.trim();return points[k]&&points[k].drivers.length>0});
  });
  return{points:result,unmatched,drivers,losers};
}
function mapUrl(loc){return loc?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc)}`:""}
function parkingUrl(loc){return loc?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc+" コインパーキング")}`:""}
function pad2(n){return n<10?"0"+n:""+n}
function applyTime(date,timeStr){
  const d=new Date(date);
  if(timeStr){const[h,m]=timeStr.split(":");d.setHours(parseInt(h)||0,parseInt(m)||0,0,0)}
  return d;
}
function fmtICSLocal(d){return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`}
function genICS(ev){
  if(!ev.matchDate)return null;
  const startTime=ev.meetTime||ev.kickoffTime;
  const start=applyTime(ev.matchDate,startTime);
  let end;
  if(ev.endTime){end=applyTime(ev.matchDate,ev.endTime)}
  else{end=new Date(start);end.setHours(end.getHours()+2)}
  const summary=ev.opponent?`⚽ ${ev.title} vs ${ev.opponent}`:`⚽ ${ev.title}`;
  const descLines=[];
  if(ev.opponent)descLines.push(`対戦相手: ${ev.opponent}`);
  if(ev.meetTime)descLines.push(`集合: ${ev.meetTime}`);
  if(ev.kickoffTime)descLines.push(`KO: ${ev.kickoffTime}`);
  if(ev.endTime)descLines.push(`終了予定: ${ev.endTime}`);
  if(ev.uniformColor)descLines.push(`ユニフォーム: ${ev.uniformColor}`);
  if(ev.notes)descLines.push(`備考: ${ev.notes}`);
  if(ev.location)descLines.push(`地図: ${mapUrl(ev.location)}`);
  const esc=(s)=>String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
  const now=new Date();
  const dtstamp=`${now.getUTCFullYear()}${pad2(now.getUTCMonth()+1)}${pad2(now.getUTCDate())}T${pad2(now.getUTCHours())}${pad2(now.getUTCMinutes())}${pad2(now.getUTCSeconds())}Z`;
  const lines=[
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Soccer Parking//Match//JA",
    "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    `UID:${ev.id||"event"}@soccer-parking`,
    `DTSTAMP:${dtstamp}`,
    `DTSTART:${fmtICSLocal(start)}`,
    `DTEND:${fmtICSLocal(end)}`,
    `SUMMARY:${esc(summary)}`,
    ev.location?`LOCATION:${esc(ev.location)}`:null,
    descLines.length?`DESCRIPTION:${esc(descLines.join("\n"))}`:null,
    "END:VEVENT",
    "END:VCALENDAR"
  ].filter(Boolean);
  return lines.join("\r\n");
}
function downloadICS(ev){
  const ics=genICS(ev);
  if(!ics){alert("試合日時を設定してからカレンダー追加できます");return}
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=(ev.title||"event").replace(/[^\w぀-ヿ一-龯-]/g,"_")+".ics";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function parseLineMessage(text){
  if(!text)return{};
  const result={};
  const t=text.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[：]/g,":").replace(/[／]/g,"/");
  // 日付: M/D, M月D日 など
  let dateMatch=t.match(/(\d{1,2})\s*[\/月\.\-]\s*(\d{1,2})(?:日)?/);
  let parsedDate=null;
  if(dateMatch){
    const m=parseInt(dateMatch[1]),d=parseInt(dateMatch[2]);
    const now=new Date();
    let y=now.getFullYear();
    const candidate=new Date(y,m-1,d);
    if(candidate<new Date(now.getTime()-86400000))y++;
    parsedDate={y,m,d};
  }
  // 対戦相手
  const vsMatch=t.match(/(?:vs\.?\s+|VS\.?\s+|対戦相手\s*:?\s*|相手\s*:?\s*|対\s+)([^\s\n,、。\(（]+(?:\s+(?:FC|fc|サッカー|SC|サッカークラブ))?)/);
  if(vsMatch)result.opponent=vsMatch[1].trim();
  // 会場
  const locMatch=t.match(/(?:会場\s*:?\s*|場所\s*:?\s*|@\s*)([^\n\(（,、]+?)(?=\s*(?:集合|キックオフ|KO|ko|ユニ|終了|解散|$|\n|時|分))/);
  if(locMatch){
    let loc=locMatch[1].trim();
    loc=loc.replace(/[「『【［\[]/g,"").replace(/[」』】］\]]/g,"");
    if(loc.length>0&&loc.length<60)result.location=loc;
  }
  // 集合時刻
  const meetMatch=t.match(/集合(?:は|が)?\s*[:\s]*(\d{1,2})\s*[:時]\s*(\d{1,2})?/);
  if(meetMatch){
    const h=parseInt(meetMatch[1]),m=parseInt(meetMatch[2]||"0");
    result.meetTime=`${pad2(h)}:${pad2(m)}`;
  }
  // キックオフ
  const koMatch=t.match(/(?:KO|ko|キックオフ|試合開始)\s*[:\s]*(\d{1,2})\s*[:時]\s*(\d{1,2})?/);
  if(koMatch){
    const h=parseInt(koMatch[1]),m=parseInt(koMatch[2]||"0");
    result.kickoffTime=`${pad2(h)}:${pad2(m)}`;
  }
  // 終了予定
  const endMatch=t.match(/(?:終了|解散|終わり)\s*予?定?\s*[:\s]*(\d{1,2})\s*[:時]\s*(\d{1,2})?/);
  if(endMatch){
    const h=parseInt(endMatch[1]),m=parseInt(endMatch[2]||"0");
    result.endTime=`${pad2(h)}:${pad2(m)}`;
  }
  // ユニフォーム (color before ユニ first, then ユニ: pattern)
  let uniMatch=t.match(/([白黒紺青赤緑黄橙桃])(?:ユニ|シャツ|の?ユニフォーム)/);
  if(!uniMatch)uniMatch=t.match(/ユニ(?:フォーム)?\s*[:：\s]+([白黒紺青赤緑黄橙桃ピンクオレンジ]+|\S+)/);
  if(uniMatch){
    const v=uniMatch[1].trim();
    if(!["で","に","の","は","を","は","と"].includes(v))result.uniformColor=v;
  }
  // matchDate (combine with kickoff or meetTime or default 09:00)
  if(parsedDate){
    const tm=result.kickoffTime||result.meetTime||"09:00";
    result.matchDate=`${parsedDate.y}-${pad2(parsedDate.m)}-${pad2(parsedDate.d)}T${tm}`;
  }
  return result;
}
function fmtMatchDetails(ev){
  const lines=[];
  if(ev.opponent)lines.push(`🆚 ${ev.opponent}`);
  if(ev.location){
    lines.push(`📍 ${ev.location}`);
    lines.push(`🗺 ${mapUrl(ev.location)}`);
  }
  if(ev.meetTime||ev.kickoffTime||ev.endTime){
    const parts=[];
    if(ev.meetTime)parts.push(`集合${ev.meetTime}`);
    if(ev.kickoffTime)parts.push(`KO${ev.kickoffTime}`);
    if(ev.endTime)parts.push(`終了${ev.endTime}`);
    lines.push(`⏰ ${parts.join(" / ")}`);
  }
  if(ev.uniformColor)lines.push(`👕 ${ev.uniformColor}`);
  if(ev.notes)lines.push(`📝 ${ev.notes}`);
  if(ev.attachments&&ev.attachments.length){
    lines.push(`📎 資料:`);
    ev.attachments.forEach(a=>lines.push(`  ${a.name||"リンク"}: ${a.url}`));
  }
  return lines.length?lines.join("\n"):"";
}

function HomeScreen({roster,events,allResponses,allLotteries,onNav,onSelectEvent,loading}){
  const[,tick]=useState(0);
  useEffect(()=>{const t=setInterval(()=>tick(x=>x+1),30000);return()=>clearInterval(t)},[]);
  const now=new Date();
  const sortedAsc=[...events].sort((a,b)=>new Date(a.matchDate||"2099-12-31")-new Date(b.matchDate||"2099-12-31"));
  const future=sortedAsc.filter(e=>!e.matchDate||new Date(e.matchDate)>=new Date(now-86400000));
  const featured=future[0]||null;
  const upcomingOthers=future.slice(1);
  const archive=[...events].filter(e=>e.matchDate&&new Date(e.matchDate)<new Date(now-86400000)).sort((a,b)=>new Date(b.matchDate)-new Date(a.matchDate));
  const[showArchive,setShowArchive]=useState(false);
  const[showUpcoming,setShowUpcoming]=useState(false);

  function renderEvent(ev){
    const er=getEventRoster(roster,ev);
    const resp=allResponses[ev.id]||{};
    const lott=allLotteries[ev.id]||null;
    const answered=Object.keys(resp).filter(id=>er.find(r=>r.id===id)).length;
    const hopefuls=Object.values(resp).filter(r=>r.attending&&r.parkingNeeded).length;
    const confirmed=getConfirmed(ev).length;
    const lottSlots=getLotterySlots(ev);
    const isPast=ev.deadline&&now>new Date(ev.deadline);
    const tl=ev.deadline&&!isPast?getTimeLeft(ev.deadline):null;
    let badge=null,bc=C.cardBorder;
    if(lott?.conducted){badge=<Tag label="✅ 抽選完了" color="lime"/>;bc="rgba(132,204,22,0.4)"}
    else if(isPast&&hopefuls>lottSlots&&lottSlots>0){badge=<Tag label="⚠️ 抽選待ち" color="amber"/>;bc="rgba(245,158,11,0.4)"}
    else if(isPast&&hopefuls>0&&hopefuls<=lottSlots){badge=<Tag label="✅ 全員OK" color="lime"/>;bc="rgba(132,204,22,0.3)"}
    else if(isPast){badge=<Tag label="締切済" color="gray"/>}
    else if(tl){badge=<Tag label={`⏱ ${tl}`} color="sky"/>}
    return(
      <div key={ev.id} className="fade-in" style={{...S.card,borderColor:bc,cursor:"pointer"}} onClick={()=>{onSelectEvent(ev.id);onNav("event")}}>
        <div style={{...S.row,marginBottom:10}}>
          <div><div style={{fontWeight:900,fontSize:16}}>{ev.title}</div>
            {ev.matchDate&&<div style={{color:C.limeLight,fontSize:12,fontWeight:700,marginTop:2}}>🗓 {fmtDate(ev.matchDate)}</div>}
          </div>{badge}
        </div>
        {(ev.opponent||ev.location||ev.meetTime||ev.kickoffTime||ev.endTime||ev.uniformColor)&&<div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:8,fontSize:12,color:C.muted}}>
          {ev.opponent&&<span>🆚 {ev.opponent}</span>}
          {ev.location&&<span>📍 {ev.location}</span>}
          {(ev.meetTime||ev.kickoffTime||ev.endTime)&&<span>⏰ {[ev.meetTime&&`集合${ev.meetTime}`,ev.kickoffTime&&`KO${ev.kickoffTime}`,ev.endTime&&`終了${ev.endTime}`].filter(Boolean).join(" / ")}</span>}
          {ev.uniformColor&&<span>👕 {ev.uniformColor}</span>}
        </div>}
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <div style={S.stat}><div style={{fontSize:18,fontWeight:900}}>{answered}<span style={{fontSize:11,color:C.dim}}>/{er.length}名</span></div><div style={{fontSize:11,color:C.muted}}>回答済み</div></div>
          <div style={S.stat}><div style={{fontSize:18,fontWeight:900,color:C.amber}}>{hopefuls}</div><div style={{fontSize:11,color:C.muted}}>駐車場希望</div></div>
          <div style={S.stat}><div style={{fontSize:18,fontWeight:900,color:C.sky}}>{ev.parkingLimit||0}</div><div style={{fontSize:11,color:C.muted}}>台まで可</div></div>
        </div>
        {confirmed>0&&<div style={{fontSize:11,color:C.sky,marginBottom:4}}>🔒 確定枠{confirmed}台 ／ 抽選枠{lottSlots}台</div>}
        {ev.deadline&&<div style={{fontSize:11,color:C.dim}}>締切: {fmtDateTime(ev.deadline)}</div>}
      </div>
    );
  }

  return(<div>
    <div style={{textAlign:"center",padding:"28px 0 20px"}}>
      <div style={{fontSize:52,marginBottom:10,display:"inline-block",animation:"spFloat 3s ease-in-out infinite"}}>⚽</div>
      <h1 style={{fontSize:26,fontWeight:900,margin:0}}>駐車場 抽選</h1>
      <p style={{color:C.limeLight,fontWeight:700,marginTop:4,fontSize:13}}>Soccer Parking Lottery</p>
    </div>
    {loading?<div style={{textAlign:"center",padding:"40px 0",color:C.muted}}>読み込み中...</div>
    :!featured&&archive.length===0?<div style={{...S.card,textAlign:"center",padding:"32px 16px"}}>
      <div style={{fontSize:40,marginBottom:12}}>📅</div>
      <p style={{color:C.muted,marginBottom:6}}>試合がまだ登録されていません</p>
      <p style={{color:C.dim,fontSize:12}}>管理者が試合を追加するまでお待ちください</p>
    </div>
    :<>
      {featured&&<>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,paddingLeft:4}}>
          <span style={{fontSize:18}}>🌟</span>
          <span style={{fontSize:13,fontWeight:900,color:C.limeLight}}>次の試合</span>
        </div>
        {renderEvent(featured)}
      </>}
      {upcomingOthers.length>0&&<div style={{marginTop:16}}>
        <button onClick={()=>setShowUpcoming(!showUpcoming)} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"10px 24px",color:"rgba(255,255,255,0.55)",fontSize:13,cursor:"pointer",fontFamily:"inherit",width:"100%"}}>
          📅 今後の試合 ({upcomingOthers.length}件) {showUpcoming?"▲":"▼"}
        </button>
        {showUpcoming&&<div style={{marginTop:8}}>{upcomingOthers.map(renderEvent)}</div>}
      </div>}
      {archive.length>0&&<div style={{marginTop:16}}>
        <button onClick={()=>setShowArchive(!showArchive)} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"10px 24px",color:"rgba(255,255,255,0.35)",fontSize:13,cursor:"pointer",fontFamily:"inherit",width:"100%"}}>
          📦 過去の試合 ({archive.length}件) {showArchive?"▲":"▼"}
        </button>
        {showArchive&&<div style={{marginTop:8}}>{archive.map(renderEvent)}</div>}
      </div>}
    </>}
    <div style={{marginTop:24,textAlign:"center"}}>
      <button onClick={()=>onNav("admin")} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"10px 24px",color:"rgba(255,255,255,0.35)",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>⚙️ 管理者メニュー</button>
    </div>
  </div>);
}
// ── EVENT SCREEN ──
function EventScreen({event,roster,responses,lottery,onBack,onSubmit,onNav,onCarpoolAmida,onSaveCarpool}){
  const er=getEventRoster(roster,event||{});
  const myKey="parkingApp_myId";
  const[memberId,setMemberId]=useState(()=>localStorage.getItem(myKey)||"");
  const[attending,setAttending]=useState(null);
  const[parking,setParking]=useState(null);
  const[carpool,setCarpool]=useState(0);
  const[meetingPoint,setMeetingPoint]=useState("");
  const[wish1,setWish1]=useState("");
  const[wish2,setWish2]=useState("");
  const[driverMpInput,setDriverMpInput]=useState("");
  const[loserWishes,setLoserWishes]=useState([]);
  const[savingCarpool,setSavingCarpool]=useState(false);
  const[err,setErr]=useState("");
  const[saving,setSaving]=useState(false);
  const[done,setDone]=useState(false);
  const[editing,setEditing]=useState(false);
  const[sectionOpen,setSectionOpen]=useState({yokou:true,parking:true,carpool:true});
  function toggleSection(k){setSectionOpen(s=>({...s,[k]:!s[k]}))}

  useEffect(()=>{
    const saved=localStorage.getItem(myKey);
    if(saved&&er.find(r=>r.id===saved)){
      setMemberId(saved);
      const prev=responses[saved];
      if(prev){
        setAttending(prev.attending);setParking(prev.parkingNeeded||false);setCarpool(prev.carpoolCapacity||0);
        setMeetingPoint(prev.meetingPoint||"");
        setWish1(prev.carpoolWishes?.[0]||"");setWish2(prev.carpoolWishes?.[1]||"");
        setDriverMpInput(prev.meetingPoint||"");
        setLoserWishes(prev.carpoolWishes||[]);
      }
    }
  },[event?.id]);

  if(!event)return null;
  const isPast=event.deadline&&new Date()>new Date(event.deadline);
  const tl=event.deadline&&!isPast?getTimeLeft(event.deadline):null;
  const limit=event.parkingLimit||0;
  const confirmed=getConfirmed(event);
  const lottSlots=getLotterySlots(event);
  const confirmedMembers=confirmed.map(id=>roster.find(r=>r.id===id)).filter(Boolean);
  const hopefuls=Object.entries(responses).filter(([id,r])=>r.attending&&r.parkingNeeded&&!confirmed.includes(id));
  const answered=Object.keys(responses).filter(id=>er.find(r=>r.id===id)).length;
  const unanswered=er.filter(r=>!responses[r.id]);
  const myResp=memberId?responses[memberId]:null;
  const isConfirmed=confirmed.includes(memberId);

  function selectMember(id){setMemberId(id);localStorage.setItem(myKey,id);
    const prev=responses[id];
    if(prev){
      setAttending(prev.attending);setParking(prev.parkingNeeded||false);setCarpool(prev.carpoolCapacity||0);
      setMeetingPoint(prev.meetingPoint||"");
      setWish1(prev.carpoolWishes?.[0]||"");setWish2(prev.carpoolWishes?.[1]||"");
      setDriverMpInput(prev.meetingPoint||"");
      setLoserWishes(prev.carpoolWishes||[]);
    }
    else{setAttending(null);setParking(null);setCarpool(0);setMeetingPoint("");setWish1("");setWish2("");setDriverMpInput("");setLoserWishes([])}
    setEditing(false);setDone(false);
  }

  async function doSubmit(){
    if(!memberId)return setErr("名前を選んでください");
    if(attending===null)return setErr("参加の有無を選んでください");
    if(attending&&!isConfirmed&&parking===null)return setErr("駐車場の希望を選んでください");
    setErr("");setSaving(true);
    const parkingNeeded=attending?(isConfirmed?true:parking):false;
    const cap=attending&&(isConfirmed||parking)?carpool:0;
    const payload={memberId,attending,parkingNeeded,carpoolCapacity:cap};
    await onSubmit(event.id,payload);
    setSaving(false);setDone(true);setEditing(false);
  }

  async function saveDriverMeetingPoint(){
    if(!driverMpInput.trim()){setErr("集合場所を入力してください");return}
    setErr("");setSavingCarpool(true);
    await onSaveCarpool(event.id,memberId,{meetingPoint:driverMpInput.trim()});
    setSavingCarpool(false);
  }
  async function saveLoserWishes(){
    setErr("");setSavingCarpool(true);
    await onSaveCarpool(event.id,memberId,{carpoolWishes:loserWishes.slice(0,2)});
    setSavingCarpool(false);
  }
  function toggleWish(mp){
    setLoserWishes(prev=>{
      if(prev.includes(mp))return prev.filter(x=>x!==mp);
      if(prev.length>=2)return [prev[1],mp];
      return [...prev,mp];
    });
  }

  function copyReminder(){
    const names=unanswered.map(r=>`#${r.num} ${r.name}`).join(", ");
    const url=window.location.href.split('#')[0];
    const details=fmtMatchDetails(event);
    const txt=`📢 回答のお願い\n━━━━━━━━━━━━\n📌 ${event.title}\n🗓 ${event.matchDate?fmtDate(event.matchDate):"未定"}${details?"\n"+details:""}\n⏰ 締切: ${event.deadline?fmtDateTime(event.deadline):"未設定"}\n━━━━━━━━━━━━\n📭 【未回答の方】\n ${names}\n━━━━━━━━━━━━\n👇 回答はこちらから\n${url}`;
    if(navigator.share){navigator.share({text:txt}).catch(()=>{})}
    else{navigator.clipboard.writeText(txt).then(()=>alert("コピーしました！LINEに貼り付けてください")).catch(()=>{
      const el=document.createElement("textarea");el.value=txt;el.style.position="absolute";el.style.left="-9999px";document.body.appendChild(el);el.select();document.execCommand("copy");document.body.removeChild(el);alert("コピーしました！LINEに貼り付けてください");
    })}
  }

  const showForm=!myResp||editing;
  const hasYokou=!!(event.opponent||event.location||event.meetTime||event.kickoffTime||event.endTime||event.uniformColor||event.notes||(event.attachments&&event.attachments.length));

  return(<div>
    <BackBar title={event.title} onBack={onBack} label="← 一覧"/>

    {hasYokou&&<Accordion title="📋 要項" open={sectionOpen.yokou} onToggle={()=>toggleSection("yokou")} accent="rgba(56,189,248,0.3)">
      {event.opponent&&<div style={{marginBottom:10}}>
        <div style={{fontSize:11,color:C.dim,marginBottom:2}}>🆚 対戦相手</div>
        <div style={{fontSize:15,fontWeight:700}}>{event.opponent}</div>
      </div>}
      {event.location&&<div style={{marginBottom:10}}>
        <div style={{fontSize:11,color:C.dim,marginBottom:2}}>📍 会場</div>
        <div style={{fontSize:15,fontWeight:700,marginBottom:8}}>{event.location}</div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>window.open(mapUrl(event.location),"_blank","noopener,noreferrer")} style={{...S.btnSm,flex:1}}>🗺 会場の地図</button>
          <button onClick={()=>window.open(parkingUrl(event.location),"_blank","noopener,noreferrer")} style={{...S.btnSm,flex:1}}>🅿️ 周辺の駐車場</button>
        </div>
      </div>}
      {(event.meetTime||event.kickoffTime||event.endTime)&&<div style={{marginBottom:10,display:"flex",gap:16,flexWrap:"wrap"}}>
        {event.meetTime&&<div><div style={{fontSize:11,color:C.dim}}>⏰ 集合</div><div style={{fontSize:15,fontWeight:700}}>{event.meetTime}</div></div>}
        {event.kickoffTime&&<div><div style={{fontSize:11,color:C.dim}}>⚽ キックオフ</div><div style={{fontSize:15,fontWeight:700}}>{event.kickoffTime}</div></div>}
        {event.endTime&&<div><div style={{fontSize:11,color:C.dim}}>🏁 終了予定</div><div style={{fontSize:15,fontWeight:700}}>{event.endTime}</div></div>}
      </div>}
      {event.uniformColor&&<div style={{marginBottom:10}}>
        <div style={{fontSize:11,color:C.dim,marginBottom:2}}>👕 ユニフォーム</div>
        <div style={{fontSize:15,fontWeight:700}}>{event.uniformColor}</div>
      </div>}
      {event.notes&&<div style={{marginBottom:10}}>
        <div style={{fontSize:11,color:C.dim,marginBottom:2}}>📝 備考</div>
        <div style={{fontSize:13,whiteSpace:"pre-wrap",lineHeight:1.5}}>{event.notes}</div>
      </div>}
      {event.attachments&&event.attachments.length>0&&<div style={{marginBottom:10}}>
        <div style={{fontSize:11,color:C.dim,marginBottom:6}}>📎 資料リンク</div>
        {event.attachments.map(a=><a key={a.id} href={a.url} target="_blank" rel="noopener noreferrer" style={{display:"block",background:"rgba(255,255,255,0.06)",borderRadius:10,padding:"10px 12px",marginBottom:4,color:C.limeLight,fontSize:13,textDecoration:"none",fontWeight:700}}>🔗 {a.name||"リンク"}</a>)}
      </div>}
      {event.matchDate&&<button onClick={()=>downloadICS(event)} style={{...S.btnSm,width:"100%",padding:"10px 16px",marginTop:4}}>📅 カレンダーに追加</button>}
    </Accordion>}

    <Accordion title="🚗 駐車場" open={sectionOpen.parking} onToggle={()=>toggleSection("parking")} accent="rgba(132,204,22,0.3)" badge={lottery?.conducted?<Tag label="抽選済" color="lime"/>:null}>
    <div style={{display:"flex",gap:8,marginBottom:12}}>
      {[{n:answered,of:er.length,l:"回答済み",c:C.limeLight},{n:hopefuls.length,of:lottSlots,l:"駐車場希望",c:C.amber},{n:limit,of:null,l:"上限台数",c:C.sky}].map(({n,of,l,c})=>
        <div key={l} style={S.stat}><div style={{fontSize:20,fontWeight:900,color:c}}>{n}{of!=null&&<span style={{fontSize:11,color:C.dim}}>/{of}</span>}</div><div style={{fontSize:11,color:C.muted,lineHeight:1.3}}>{l}</div></div>
      )}
    </div>

    {confirmed.length>0&&<div style={S.cardLock}>
      <div style={{fontWeight:700,color:C.sky,marginBottom:8,fontSize:13}}>🔒 確定枠 {confirmed.length}台</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
        {confirmedMembers.map(m=><Tag key={m.id} label={`#${m.num} ${m.name}`} color="sky"/>)}
      </div>
      <div style={{fontSize:11,color:C.dim,marginTop:8}}>抽選枠: {lottSlots}台</div>
    </div>}

    {event.deadline&&<div style={{...S.card,display:"flex",justifyContent:"space-between",alignItems:"center",borderColor:isPast?"rgba(239,68,68,0.35)":"rgba(132,204,22,0.3)"}}>
      <div><div style={{fontSize:12,color:C.dim}}>回答締切</div><div style={{fontWeight:700,fontSize:14}}>{fmtDateTime(event.deadline)}</div></div>
      {isPast?<Tag label="締切済み" color="red"/>:tl?<span style={{color:C.limeLight,fontWeight:700,fontSize:14}}>⏱ 残り {tl}</span>:null}
    </div>}

    {lottery?.conducted&&<Btn variant="yellow" onClick={()=>onNav("results")} style={{marginBottom:12}}>🎉 抽選結果を見る</Btn>}

    {!lottery?.conducted&&hopefuls.length>lottSlots&&lottSlots>0&&<div style={{...S.cardAmber,textAlign:"center",marginTop:8}}>
      <p style={{color:C.amber,fontWeight:700,marginBottom:4}}>⚠️ 抽選が必要です</p>
      <p style={{color:C.muted,fontSize:12,marginBottom:12}}>希望 {hopefuls.length}名 ＞ 抽選枠 {lottSlots}台</p>
      <Btn variant="yellow" onClick={()=>onNav("admin")}>🎰 管理者画面で抽選する</Btn>
    </div>}

    {!lottery?.conducted&&hopefuls.length>0&&hopefuls.length<=lottSlots&&<div style={{...S.cardLime,textAlign:"center",marginTop:8}}>
      <p style={{color:C.limeLight,fontWeight:700}}>✅ 全員分の駐車場が確保できます</p>
      <p style={{color:C.dim,fontSize:12}}>希望 {hopefuls.length}名 ≤ {lottSlots}台</p>
    </div>}

    {!lottery?.conducted&&<div style={{...S.card,borderColor:"rgba(132,204,22,0.3)"}}>
      <div style={{fontSize:14,fontWeight:900,color:C.limeLight,marginBottom:12}}>✏️ 参加登録{isPast?" (締切後)":""}</div>
      {isPast&&<p style={{color:C.amber,fontSize:12,marginBottom:8}}>⚠️ 締切を過ぎていますが登録できます</p>}
      <div style={{marginBottom:12}}>
        <div style={{fontSize:12,color:C.muted,marginBottom:6}}>👦 選手を選んでください</div>
        <select value={memberId} onChange={e=>selectMember(e.target.value)} style={S.select}>
          <option value="">─ 選んでください ─</option>
          {er.map(r=><option key={r.id} value={r.id}>#{r.num} {r.name} ({r.grade||"4年"}){responses[r.id]?" ✓":""}{confirmed.includes(r.id)?" 🔒":""}</option>)}
        </select>
      </div>
      {memberId&&isConfirmed&&<div style={{...S.cardLock,margin:"0 0 12px"}}>
        <p style={{color:C.sky,fontWeight:700,fontSize:14}}>🔒 駐車場確定枠です</p>
        <p style={{color:C.dim,fontSize:12}}>抽選なしで駐車場を利用できます</p>
      </div>}
      {memberId&&myResp&&!editing&&<div style={{background:"rgba(132,204,22,0.08)",borderRadius:12,padding:12,marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:13}}>{myResp.attending?"✅ 参加":"❌ 欠席"}</div>
            {myResp.attending&&<div style={{fontSize:13,marginTop:4}}>{myResp.parkingNeeded?`🚗 駐車場希望${myResp.carpoolCapacity>0?` (乗合+${myResp.carpoolCapacity})`:""}`:"🚶 駐車場不要"}</div>}
          </div>
          {!isPast?<button onClick={()=>setEditing(true)} style={S.btnSm}>内容を修正する</button>:<span style={{fontSize:11,color:C.amber}}>締切後のため修正不可</span>}
        </div>
        {done&&<p style={{color:C.limeLight,fontSize:12,marginTop:6}}>✅ 登録しました！</p>}
      </div>}
      {memberId&&showForm&&<>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:12,color:C.muted,marginBottom:8}}>⚽ 試合に参加しますか？</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setAttending(true)} style={S.choice(attending===true,"lime")}>✅ 参加する</button>
            <button onClick={()=>{setAttending(false);setParking(false)}} style={S.choice(attending===false,"rose")}>❌ 欠席</button>
          </div>
        </div>
        {attending===true&&<div style={{marginBottom:12}} className="fade-in">
          {!isConfirmed?<div>
            <div style={{fontSize:12,color:C.muted,marginBottom:8}}>🚗 駐車場を希望しますか？</div>
            <div style={{display:"flex",gap:8,marginBottom:8}}>
              <button onClick={()=>setParking(true)} style={S.choice(parking===true,"amber")}>🚗 希望する</button>
              <button onClick={()=>{setParking(false);setCarpool(0)}} style={S.choice(parking===false,"lime")}>🚶 不要です</button>
            </div>
          </div>:null}
          {(parking===true||isConfirmed)&&<div style={{background:"rgba(255,255,255,0.05)",padding:12,borderRadius:12,marginTop:8}}>
            <div style={{fontSize:12,color:C.dim,marginBottom:6}}>🚙 他の人を乗合できますか？</div>
            <select value={carpool} onChange={e=>setCarpool(Number(e.target.value))} style={S.select}>
              <option value={0}>乗合不可（自分の分のみ）</option>
              {[1,2,3,4,5].map(n=><option key={n} value={n}>乗合可：{n}人まで</option>)}
            </select>
            {event.carpoolEnabled&&carpool>0&&<p style={{fontSize:11,color:C.dim,marginTop:8,lineHeight:1.5}}>※ 集合場所は駐車場抽選後に登録できます</p>}
          </div>}
          {!isConfirmed&&<p style={{fontSize:12,color:C.dim,textAlign:"center",marginTop:8}}>抽選枠 {lottSlots}台・超過時はあみだくじ</p>}
        </div>}
        <ErrMsg msg={err}/>
        <Btn onClick={doSubmit} disabled={saving||!memberId||attending===null||(attending&&!isConfirmed&&parking===null)}>{saving?"送信中...":myResp?"変更を保存 →":"登録する →"}</Btn>
        {editing&&<Btn variant="ghost" onClick={()=>setEditing(false)} style={{marginTop:8}}>キャンセル</Btn>}
      </>}
    </div>}

    {unanswered.length>0&&<div style={{...S.card,marginTop:8}}>
      <div style={{...S.row,marginBottom:8}}>
        <div style={{fontSize:12,color:C.dim}}>📭 未回答 {unanswered.length}名</div>
        <button onClick={copyReminder} style={S.btnSm}>📢 催促テキスト</button>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:4}}>{unanswered.map(r=><Tag key={r.id} label={`#${r.num} ${r.name}`} color="gray"/>)}</div>
    </div>}
    </Accordion>

    {event.carpoolEnabled&&lottery?.conducted&&<Accordion title="🚙 配車" open={sectionOpen.carpool} onToggle={()=>toggleSection("carpool")} accent="rgba(132,204,22,0.4)">
    {(()=>{
      const winnersList=lottery.winners||[];
      const isMyWinner=memberId&&(winnersList.includes(memberId)||confirmed.includes(memberId));
      const myAttending=memberId&&responses[memberId]?.attending;
      const myCap=memberId?(responses[memberId]?.carpoolCapacity||0):0;
      const myParking=memberId&&responses[memberId]?.parkingNeeded;
      const isMyDriver=isMyWinner&&myAttending&&myCap>0;
      const isMyLoser=memberId&&!isMyWinner&&myAttending&&myParking;
      const publicPoints=Object.entries(responses).filter(([id,r])=>r.attending&&r.meetingPoint&&(winnersList.includes(id)||confirmed.includes(id))&&r.carpoolCapacity>0).map(([id,r])=>r.meetingPoint.trim()).filter((v,i,a)=>a.indexOf(v)===i);
      const m=computeCarpoolMatching(event,responses,lottery);
      const hasMatching=m&&(m.points.length>0||m.unmatched.length>0);
      const myMpSaved=!!responses[memberId]?.meetingPoint;
      const myWishesSaved=(responses[memberId]?.carpoolWishes||[]).length>0;
      return <>
        {isMyDriver&&<div style={{...S.card,borderColor:"rgba(245,158,11,0.4)",background:"rgba(245,158,11,0.05)"}}>
          <div style={{fontWeight:900,color:C.amber,marginBottom:8}}>🚗 集合場所を登録（あなたはドライバー）</div>
          <p style={{fontSize:11,color:C.dim,marginBottom:10}}>登録した集合場所は乗合希望者の公募リストに表示されます</p>
          <input value={driverMpInput} onChange={e=>setDriverMpInput(e.target.value)} placeholder="例：○○駅 西口 7:30" style={{...S.input,marginBottom:8}} autoComplete="off"/>
          <Btn variant="yellow" onClick={saveDriverMeetingPoint} disabled={savingCarpool}>{savingCarpool?"保存中...":myMpSaved?"💾 集合場所を更新":"💾 集合場所を登録"}</Btn>
          {myMpSaved&&<p style={{color:C.limeLight,fontSize:11,marginTop:6,textAlign:"center"}}>✅ 現在の登録: {responses[memberId].meetingPoint}</p>}
        </div>}

        {isMyLoser&&<div style={{...S.card,borderColor:"rgba(56,189,248,0.4)",background:"rgba(56,189,248,0.05)"}}>
          <div style={{fontWeight:900,color:C.sky,marginBottom:8}}>🚙 乗合希望を選択（最大2箇所）</div>
          {publicPoints.length===0?<p style={{fontSize:12,color:C.dim}}>ドライバーがまだ集合場所を登録していません。しばらくお待ちください。</p>
            :<>
              <p style={{fontSize:11,color:C.dim,marginBottom:10}}>乗合できる集合場所を最大2箇所選択してください</p>
              {publicPoints.map(mp=>{
                const dlist=Object.entries(responses).filter(([id,r])=>r.meetingPoint?.trim()===mp&&(winnersList.includes(id)||confirmed.includes(id))&&r.carpoolCapacity>0);
                const cap=dlist.reduce((s,[id,r])=>s+r.carpoolCapacity,0);
                const sel=loserWishes.includes(mp);
                return <button key={mp} onClick={()=>toggleWish(mp)} style={{display:"block",width:"100%",textAlign:"left",background:sel?"rgba(56,189,248,0.2)":"rgba(255,255,255,0.05)",border:sel?"2px solid #38bdf8":"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"10px 12px",marginBottom:6,color:"#fff",cursor:"pointer",fontFamily:"inherit"}}>
                  <div style={{fontSize:13,fontWeight:700}}>{sel?"✅ ":"⬜ "}📍 {mp}</div>
                  <div style={{fontSize:11,color:C.dim,marginTop:2}}>ドライバー{dlist.length}名・座席計{cap}</div>
                </button>;
              })}
              <Btn variant="yellow" onClick={saveLoserWishes} disabled={savingCarpool||loserWishes.length===0} style={{marginTop:6}}>{savingCarpool?"保存中...":myWishesSaved?"💾 希望を更新":"💾 希望を登録"}</Btn>
              {myWishesSaved&&<p style={{color:C.limeLight,fontSize:11,marginTop:6,textAlign:"center"}}>✅ 現在の希望: {(responses[memberId].carpoolWishes||[]).join(" / ")}</p>}
            </>}
        </div>}

        {hasMatching&&<div style={{...S.card,borderColor:"rgba(132,204,22,0.4)",background:"rgba(132,204,22,0.05)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div style={{fontWeight:900,color:C.limeLight}}>🚙 配車マッチング</div>
            <button onClick={()=>{
              const L=[`🚙 配車マッチング結果`,`📌 ${event.title}`,`🗓 ${event.matchDate?fmtDate(event.matchDate):"未定"}`];
              if(event.location){L.push(`📍 ${event.location}`);L.push(`🗺 ${mapUrl(event.location)}`)}
              L.push("━━━━━━━━━━━━");
              m.points.forEach(p=>{
                L.push(`📍 ${p.meetingPoint}`);
                p.drivers.forEach(d=>{const dm=roster.find(r=>r.id===d.id);if(dm)L.push(`  🚗 #${dm.num} ${dm.name}（${d.capacity}席）`)});
                const assignedIds=p.assigned||(p.overflow?[]:p.riders.map(r=>r.id));
                if(assignedIds.length){L.push(`  ✅ 乗車: `+assignedIds.map(id=>{const me=roster.find(r=>r.id===id);return me?`#${me.num} ${me.name}`:""}).filter(Boolean).join(", "))}
                if(p.overflow&&!p.assigned)L.push(`  ⚠️ 定員オーバー（あみだ未実施）`);
                L.push("");
              });
              if(m.unmatched.length){L.push("⚠️ 未成立");m.unmatched.forEach(id=>{const me=roster.find(r=>r.id===id);if(me)L.push(`  ・#${me.num} ${me.name}`)})}
              const txt=L.join("\n");
              if(navigator.share){navigator.share({text:txt}).catch(()=>{})}
              else{navigator.clipboard.writeText(txt).then(()=>alert("コピーしました！LINEに貼り付けてください")).catch(()=>{
                const el=document.createElement("textarea");el.value=txt;el.style.position="absolute";el.style.left="-9999px";document.body.appendChild(el);el.select();document.execCommand("copy");document.body.removeChild(el);alert("コピーしました！");
              })}
            }} style={S.btnSm}>📋 LINE共有</button>
          </div>
          {m.points.map(p=><div key={p.meetingPoint} style={{background:"rgba(0,0,0,0.2)",borderRadius:12,padding:12,marginBottom:8}}>
            <div style={{fontSize:13,fontWeight:700,color:"#fff",marginBottom:8}}>📍 {p.meetingPoint}</div>
            <div style={{fontSize:11,color:C.dim,marginBottom:4}}>🚗 ドライバー（座席計{p.totalCapacity}）</div>
            {p.drivers.map(d=>{const mm=roster.find(r=>r.id===d.id);return mm?<div key={d.id} style={{fontSize:13,color:C.amber,marginBottom:2}}>・#{mm.num} {mm.name}（{d.capacity}席）</div>:null})}
            <div style={{fontSize:11,color:C.dim,marginTop:8,marginBottom:4}}>🚙 乗合希望者（{p.riders.length}名）{p.overflow&&<span style={{color:"#f87171",fontWeight:700,marginLeft:4}}>⚠️ 定員オーバー</span>}</div>
            {p.riders.map(r=>{const me=roster.find(x=>x.id===r.id);if(!me)return null;
              const isAssigned=(p.assigned||[]).includes(r.id)||(!p.overflow&&!p.assigned);
              return <div key={r.id} style={{fontSize:13,color:isAssigned?C.limeLight:C.muted,marginBottom:2,display:"flex",alignItems:"center",gap:6}}>
                <span>{isAssigned?"✅":"❓"}</span><span>#{me.num} {me.name}</span>
              </div>})}
            {p.overflow&&!p.assigned&&onCarpoolAmida&&<Btn variant="yellow" onClick={()=>onCarpoolAmida(event.id,p.meetingPoint,p.riders.map(r=>r.id),p.totalCapacity)} style={{marginTop:8}}>🎰 あみだで乗車者を決定</Btn>}
          </div>)}
          {m.unmatched.length>0&&<div style={{background:"rgba(239,68,68,0.08)",borderRadius:12,padding:12,marginTop:8}}>
            <div style={{fontSize:12,color:"#f87171",fontWeight:700,marginBottom:4}}>⚠️ 乗合未成立 {m.unmatched.length}名</div>
            <div style={{fontSize:11,color:C.dim,marginBottom:4}}>希望集合場所にドライバーがいません</div>
            {m.unmatched.map(id=>{const me=roster.find(r=>r.id===id);return me?<div key={id} style={{fontSize:12,color:C.muted}}>・#{me.num} {me.name}</div>:null})}
          </div>}
        </div>}
      </>;
    })()}
    </Accordion>}
  </div>);
}
// ── ADMIN SCREEN ──
function AdminScreen({roster,events,allResponses,allLotteries,onSelectEvent,onSaveEvent,onDeleteEvent,onSaveRoster,onRunLottery,onReLottery,onResetResponses,onBack,onNav}){
  const[tab,setTab]=useState("events");
  const[msg,setMsg]=useState("");
  const flash=m=>{setMsg(m);setTimeout(()=>setMsg(""),3000)};
  const[modal,setModal]=useState(null);
  function confirm(m){return new Promise(res=>{setModal({m,ok:()=>{setModal(null);res(true)},no:()=>{setModal(null);res(false)}})})}

  // Roster
  const[rosterRows,setRosterRows]=useState(null);
  const[rosterDirty,setRosterDirty]=useState(false);
  const inputRefs=useRef({});
  const endRef=useRef(null);
  const allGrades=[...new Set(roster.map(r=>r.grade||"4年"))].sort();

  useEffect(()=>{if(tab==="roster"&&rosterRows===null)setRosterRows(roster.map(r=>({...r})))},[tab,roster]);

  function addRow(){const nr={id:uid(),num:"",name:"",grade:allGrades[0]||"4年"};setRosterRows(r=>[...r,nr]);setRosterDirty(true);
    setTimeout(()=>{inputRefs.current[`num_${nr.id}`]?.focus();endRef.current?.scrollIntoView({behavior:"smooth"})},50)}
  function removeRow(id){setRosterRows(r=>r.filter(x=>x.id!==id));setRosterDirty(true)}
  function updateRow(id,f,v){setRosterRows(r=>r.map(x=>x.id===id?{...x,[f]:v}:x));setRosterDirty(true)}
  async function saveRoster(){const v=rosterRows.filter(r=>r.name.trim());if(!v.length)return flash("⚠️ 名前を入力");await onSaveRoster(v);setRosterDirty(false);flash("✅ 保存しました！")}
  function discardRoster(){setRosterRows(roster.map(r=>({...r})));setRosterDirty(false);flash("↺ 元に戻しました")}

  // Event edit
  const[editEv,setEditEv]=useState(null);
  const[evLimit,setEvLimit]=useState(5);
  const[evErr,setEvErr]=useState("");
  const[evDirty,setEvDirty]=useState(false);
  const[evConfirmed,setEvConfirmed]=useState([]);
  const[evGrades,setEvGrades]=useState([]);
  const[detailsOpen,setDetailsOpen]=useState(false);
  const[attName,setAttName]=useState("");
  const[attUrl,setAttUrl]=useState("");
  const[parseInput,setParseInput]=useState("");
  const[parseOpen,setParseOpen]=useState(false);
  const[parseFlash,setParseFlash]=useState("");

  useEffect(()=>{
    if(editEv){
      const hasDetails=!!(editEv.opponent||editEv.location||editEv.kickoffTime||editEv.meetTime||editEv.endTime||editEv.uniformColor||editEv.notes||(editEv.attachments&&editEv.attachments.length));
      setDetailsOpen(hasDetails);
    }
  },[editEv?.id]);

  function startEdit(ev){setEditEv({...ev});setEvLimit(ev.parkingLimit||5);setEvConfirmed(ev.confirmedParking||[]);setEvGrades(ev.inviteGrades||[...allGrades]);setEvErr("");setEvDirty(false)}
  function startNew(){const id=uid();setEditEv({_new:true,id,title:"",matchDate:"",deadline:"",parkingLimit:5});setEvLimit(5);setEvConfirmed([]);setEvGrades([...allGrades]);setEvErr("");setEvDirty(false)}
  function updateEv(f,v){setEditEv(p=>({...p,[f]:v}));setEvDirty(true)}
  function toggleGrade(g){setEvGrades(p=>p.includes(g)?p.filter(x=>x!==g):[...p,g]);setEvDirty(true)}
  function toggleConfirmed(id){setEvConfirmed(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);setEvDirty(true)}

  async function saveEditEv(){
    if(!editEv.title.trim()){setEvErr("⚠️ タイトルを入力");return}
    if(evGrades.length===0){setEvErr("⚠️ 参加対象を選択");return}
    await onSaveEvent({...editEv,parkingLimit:evLimit,confirmedParking:evConfirmed,inviteGrades:evGrades,_new:undefined});
    setEditEv(null);setEvDirty(false);flash("✅ 保存しました！")}
  async function cancelEditEv(){if(evDirty){const ok=await confirm("編集を破棄しますか？");if(!ok)return}setEditEv(null);setEvErr("")}

  async function changeTab(t){
    if(t===tab)return;
    if(tab==="events"&&editEv&&evDirty){const ok=await confirm("編集を破棄しますか？");if(!ok)return;setEditEv(null)}
    if(tab==="roster"&&rosterDirty){const ok=await confirm("名簿の変更を破棄しますか？");if(!ok)return;setRosterRows(null);setRosterDirty(false)}
    setTab(t)}

  async function handleBack(){
    if((tab==="events"&&editEv&&evDirty)||(tab==="roster"&&rosterDirty)){const ok=await confirm("保存せずに戻りますか？");if(!ok)return}
    onBack()}

  const TABS=[["events","📅 試合"],["roster","👦 名簿"],["check","📋 回答"]];
  const evRoster=editEv?roster.filter(r=>(evGrades||allGrades).includes(r.grade||"4年")):[];

  if(editEv)return(<div>
    <BackBar title={editEv._new?"試合を追加":"試合を編集"} onBack={cancelEditEv} label="← キャンセル"/>
    {evDirty&&<p style={{textAlign:"center",fontSize:11,color:C.amber,marginBottom:8}}>● 未保存の変更</p>}

    <div style={S.card}>
      <button onClick={()=>setParseOpen(o=>!o)} style={{background:"none",border:"none",color:"#fff",fontFamily:"inherit",width:"100%",textAlign:"left",cursor:"pointer",padding:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:13,color:C.limeLight,fontWeight:900}}>✨ LINE文を貼り付けて自動入力</div>
        <div style={{fontSize:14,color:C.dim}}>{parseOpen?"▲":"▼"}</div>
      </button>
      {parseOpen&&<div style={{marginTop:12}} className="fade-in">
        <p style={{fontSize:11,color:C.dim,marginBottom:8,lineHeight:1.5}}>コーチからの試合連絡（日時・対戦相手・会場・集合時刻・KO・ユニ等）をそのまま貼り付けて「解析」を押してください</p>
        <textarea value={parseInput} onChange={e=>setParseInput(e.target.value)} placeholder={"例：\n5/23(土) 9:00 KO\n会場：中央公園グラウンド\n対戦相手 鶴ヶ岡FC\n集合 8:00\n終了 11:00\nユニ：白"} rows={6} style={{...S.input,resize:"vertical",minHeight:90,fontFamily:"inherit",marginBottom:8}}/>
        {parseFlash&&<p style={{fontSize:12,color:C.limeLight,textAlign:"center",marginBottom:8}}>{parseFlash}</p>}
        <Btn variant="yellow" onClick={()=>{
          const parsed=parseLineMessage(parseInput);
          const keys=Object.keys(parsed);
          if(keys.length===0){setParseFlash("⚠️ 抽出できる項目がありませんでした");setTimeout(()=>setParseFlash(""),3000);return}
          keys.forEach(k=>updateEv(k,parsed[k]));
          // Open match details accordion so user can verify
          setDetailsOpen(true);
          setParseFlash(`✅ ${keys.length}項目を自動入力: ${keys.join(", ")}`);
          setTimeout(()=>setParseFlash(""),5000);
          setParseInput("");setParseOpen(false);
        }}>✨ 解析して入力</Btn>
      </div>}
    </div>

    <div style={S.card}>
      <div style={{fontSize:12,color:C.dim,marginBottom:6}}>タイトル</div>
      <input value={editEv.title} onChange={e=>updateEv("title",e.target.value)} placeholder="例：土曜 練習試合" style={S.input} autoComplete="off"/>
    </div>
    {[["試合日時","matchDate"],["回答締切","deadline"]].map(([l,k])=><div key={k} style={S.card}>
      <div style={{fontSize:12,color:C.dim,marginBottom:6}}>{l}（任意）</div>
      <input type="datetime-local" value={editEv[k]||""} onChange={e=>updateEv(k,e.target.value)} style={{...S.input,colorScheme:"dark"}}/>
      {editEv[k]&&<button onClick={()=>updateEv(k,"")} style={{background:"none",border:"none",color:C.dim,fontSize:12,cursor:"pointer",marginTop:4}}>× クリア</button>}
    </div>)}
    <div style={S.card}>
      <div style={{fontSize:12,color:C.dim,marginBottom:12}}>🚗 駐車場の台数上限</div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:24}}>
        <button onClick={()=>{setEvLimit(l=>Math.max(1,l-1));setEvDirty(true)}} style={{width:52,height:52,borderRadius:"50%",background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",fontSize:28,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
        <span style={{fontSize:52,fontWeight:900,color:C.limeLight,width:64,textAlign:"center"}}>{evLimit}</span>
        <button onClick={()=>{setEvLimit(l=>l+1);setEvDirty(true)}} style={{width:52,height:52,borderRadius:"50%",background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",fontSize:28,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>＋</button>
      </div>
    </div>

    {allGrades.length>1&&<div style={S.card}>
      <div style={{fontSize:12,color:C.dim,marginBottom:10}}>📋 参加対象</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {allGrades.map(g=><button key={g} onClick={()=>toggleGrade(g)} style={{padding:"8px 16px",borderRadius:12,border:"none",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",background:evGrades.includes(g)?C.lime:"rgba(255,255,255,0.08)",color:evGrades.includes(g)?"#052e16":"rgba(255,255,255,0.5)",transition:"all .2s"}}>{g} {evGrades.includes(g)?"✓":""}</button>)}
      </div>
    </div>}

    <div style={S.card}>
      <div style={{fontSize:12,color:C.dim,marginBottom:10}}>🔒 確定枠（抽選なしで駐車場確定）</div>
      {evRoster.length===0?<p style={{color:C.dim,fontSize:13}}>対象メンバーがいません</p>
      :<div style={{maxHeight:200,overflowY:"auto"}}>{evRoster.map(r=><div key={r.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 12px",marginBottom:4,background:evConfirmed.includes(r.id)?"rgba(56,189,248,0.1)":"rgba(255,255,255,0.04)",borderRadius:10,cursor:"pointer",transition:"all .2s"}} onClick={()=>toggleConfirmed(r.id)}>
        <span style={{fontSize:13}}><span style={{color:C.dim,fontSize:11}}>#{r.num} </span>{r.name}<span style={{color:C.dim,fontSize:11}}> ({r.grade||"4年"})</span></span>
        {evConfirmed.includes(r.id)?<Tag label="🔒 確定" color="sky"/>:<span style={{color:C.faint,fontSize:12}}>タップで確定</span>}
      </div>)}</div>}
      <div style={{fontSize:12,color:C.sky,marginTop:8,fontWeight:700}}>確定: {evConfirmed.length}台 ／ 抽選枠: {Math.max(0,evLimit-evConfirmed.length)}台</div>
    </div>

    <div style={S.card}>
      <button onClick={()=>setDetailsOpen(o=>!o)} style={{background:"none",border:"none",color:"#fff",fontFamily:"inherit",width:"100%",textAlign:"left",cursor:"pointer",padding:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:12,color:C.dim}}>📋 試合要項（任意）</div>
        <div style={{fontSize:14,color:C.dim}}>{detailsOpen?"▲":"▼"}</div>
      </button>
      {detailsOpen&&<div style={{marginTop:12}} className="fade-in">
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:C.dim,marginBottom:4}}>🆚 対戦相手</div>
          <input value={editEv.opponent||""} onChange={e=>updateEv("opponent",e.target.value)} placeholder="例：鶴ヶ岡FC" style={S.input} autoComplete="off"/>
        </div>
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:C.dim,marginBottom:4}}>📍 会場</div>
          <input value={editEv.location||""} onChange={e=>updateEv("location",e.target.value)} placeholder="例：中央公園グラウンド" style={S.input} autoComplete="off"/>
        </div>
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:C.dim,marginBottom:4}}>⏰ 集合時刻</div>
          <input type="time" value={editEv.meetTime||""} onChange={e=>updateEv("meetTime",e.target.value)} style={{...S.input,colorScheme:"dark"}}/>
        </div>

// ── LOTTERY ──
const PATH_COLORS=["#84cc16","#f59e0b","#3b82f6","#ec4899","#8b5cf6","#06b6d4","#f97316","#14b8a6","#a3e635","#fb923c"];
function genRungs(n,rows){return Array.from({length:rows},()=>{const s=new Set();let c=0;while(c<n-1){if(Math.random()<0.42){s.add(c);c+=2}else c++}return s})}
function buildPaths(n,rows,rungs,CW,RH,PX,PY){
  const cx=c=>PX+c*CW+CW/2;
  return Array.from({length:n},(_,start)=>{
    let col=start,d=`M${cx(col)},${PY}`;
    for(let r=0;r<rows;r++){const my=PY+(r+.5)*RH,ny=PY+(r+1)*RH;if(rungs[r].has(col)){d+=`L${cx(col)},${my}L${cx(col+1)},${my}`;col++;d+=`L${cx(col)},${ny}`}else if(col>0&&rungs[r].has(col-1)){d+=`L${cx(col)},${my}L${cx(col-1)},${my}`;col--;d+=`L${cx(col)},${ny}`}else d+=`L${cx(col)},${ny}`}
    return{d,finalCol:col}});
}
function LotteryScreen({event,participants,limit,isRerun,mode,carpoolPoint,onComplete,onBack}){
  const n=participants.length;const ref=useRef(null);
  const[svgW,setSvgW]=useState(340);
  useEffect(()=>{if(ref.current)setSvgW(ref.current.offsetWidth-16)},[]);
  const ROWS=18,CW=Math.max(32,Math.min(60,Math.floor((svgW-40)/Math.max(n,1)))),RH=24,PX=20,PY=44;
  const SVG_W=n*CW+PX*2,SVG_H=ROWS*RH+PY*2+32;
  const colX=c=>PX+c*CW+CW/2;
  const[rungs]=useState(()=>genRungs(n,ROWS));
  const[paths]=useState(()=>buildPaths(n,ROWS,rungs,CW,RH,PX,PY));
  const outcomes=paths.map((p,i)=>({i,id:participants[i]?.id,name:participants[i]?.name,finalCol:p.finalCol,isWinner:p.finalCol<limit}));
  const rungLines=[];
  for(let r=0;r<ROWS;r++){const y=PY+(r+.5)*RH;rungs[r].forEach(lc=>rungLines.push({x1:colX(lc),x2:colX(lc+1),y}))}

  const[phase,setPhase]=useState("ready");
  const[curIdx,setCurIdx]=useState(0);
  const[revealed,setRevealed]=useState({});
  const pathRefs=useRef([]);

  useEffect(()=>{
    if(phase!=="animating")return;
    if(curIdx>=n){setPhase("done");setTimeout(()=>onComplete(outcomes.filter(o=>o.isWinner).map(o=>o.id)),2000);return}
    const el=pathRefs.current[curIdx];if(!el){setCurIdx(c=>c+1);return}
    const isWin=outcomes[curIdx].isWinner,color=PATH_COLORS[curIdx%PATH_COLORS.length],len=el.getTotalLength();
    el.style.transition="none";el.style.stroke=color;el.style.opacity="1";el.style.strokeDasharray=`${len}`;el.style.strokeDashoffset=`${len}`;
    let t1,t2,raf;
    raf=requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const dur=Math.max(600,1400-n*35);
      el.style.transition=`stroke-dashoffset ${dur}ms linear`;el.style.strokeDashoffset="0";
      t1=setTimeout(()=>{el.style.stroke=isWin?"#f59e0b":"#374151";setRevealed(p=>({...p,[curIdx]:isWin}));t2=setTimeout(()=>setCurIdx(c=>c+1),400)},dur);
    }));
    return()=>{cancelAnimationFrame(raf);clearTimeout(t1);clearTimeout(t2)};
  },[curIdx,phase]);

  return(<div>
    <BackBar title={mode==="carpool"?"🚙 配車あみだくじ":isRerun?"🔄 再抽選":"🎰 あみだくじ抽選"} onBack={onBack} label="← 戻る"/>
    <div style={{...S.card,textAlign:"center"}}>
      {mode==="carpool"&&<div style={{color:C.limeLight,fontSize:12,fontWeight:700,marginBottom:6}}>📍 {carpoolPoint}（定員オーバーのため乗車者を決定）</div>}
      {isRerun&&mode!=="carpool"&&<div style={{color:C.amber,fontSize:12,fontWeight:700,marginBottom:6}}>⚠️ 当選者キャンセルによる再抽選</div>}
      <span style={{color:C.muted,fontSize:14}}><span style={{color:C.amber,fontWeight:700}}>{n}名</span> の希望者 → <span style={{color:C.limeLight,fontWeight:700}}>{limit}{mode==="carpool"?"席":isRerun?"枠":"台"}</span> 当選</span>
    </div>
    <div ref={ref} style={{width:"100%",overflowX:"auto",background:"rgba(0,0,0,0.25)",borderRadius:16,padding:8,marginBottom:12}}>
      <svg width={SVG_W} height={SVG_H} style={{minWidth:SVG_W,display:"block",margin:"0 auto"}}>
        {participants.map((p,i)=><text key={i} x={colX(i)} y={PY-18} textAnchor="middle" fontSize="10" fontWeight="bold" fill={revealed[i]!==undefined?(revealed[i]?"#f59e0b":"#4b5563"):i===curIdx&&phase==="animating"?PATH_COLORS[i%PATH_COLORS.length]:"#6b7280"}>{(p.name||"").slice(0,3)}</text>)}
        {Array.from({length:n},(_,i)=><line key={i} x1={colX(i)} y1={PY} x2={colX(i)} y2={PY+ROWS*RH} stroke="#1a4a1a" strokeWidth="2.5"/>)}
        {rungLines.map((r,i)=><line key={i} x1={r.x1} y1={r.y} x2={r.x2} y2={r.y} stroke="#1a4a1a" strokeWidth="2.5"/>)}
        {paths.map((p,i)=><path key={i} ref={el=>pathRefs.current[i]=el} d={p.d} fill="none" stroke="transparent" strokeWidth="3.5" strokeLinecap="round" style={{opacity:0}}/>)}
        {Array.from({length:n},(_,i)=>{const win=i<limit;return(<g key={i}><rect x={colX(i)-15} y={PY+ROWS*RH+4} width="30" height="20" rx="5" fill={win?"#78350f":"#111827"}/><text x={colX(i)} y={PY+ROWS*RH+18} textAnchor="middle" fontSize="9" fontWeight="bold" fill={win?"#fde047":"#4b5563"}>{win?"当選":"落選"}</text></g>)})}
      </svg>
    </div>
    {phase!=="ready"&&<div style={{display:"flex",justifyContent:"center",gap:6,flexWrap:"wrap",marginBottom:12}}>{participants.map((_,i)=><div key={i} style={{width:revealed[i]===true||(i===curIdx&&phase==="animating")?12:8,height:revealed[i]===true||(i===curIdx&&phase==="animating")?12:8,borderRadius:"50%",background:revealed[i]===true?C.amber:revealed[i]===false?"#374151":i===curIdx&&phase==="animating"?"#fff":"rgba(255,255,255,0.2)",transition:"all 0.3s"}}/>)}</div>}
    {phase==="animating"&&<p style={{textAlign:"center",color:C.muted,fontSize:14}}>{participants[curIdx]?.name} のルートを辿っています...</p>}
    {phase==="ready"&&<Btn variant="yellow" onClick={()=>{setPhase("animating");setCurIdx(0)}}>✨ スタート！</Btn>}
    {phase==="done"&&<div style={{textAlign:"center"}}><div style={{fontSize:40,marginBottom:8}}>🎊</div><p style={{color:C.limeLight,fontWeight:900,fontSize:20}}>抽選完了！</p><p style={{color:C.muted,fontSize:14}}>結果画面へ移動します...</p></div>}
  </div>);
}

// ── RESULTS ──
function ResultsScreen({event,roster,responses,lottery,onReLottery,onBack}){
  const[copied,setCopied]=useState(false);
  if(!lottery?.conducted)return(<div style={{textAlign:"center",paddingTop:64}}><p style={{color:C.muted}}>まだ抽選が行われていません</p><Btn variant="ghost" onClick={onBack} style={{marginTop:16}}>← 戻る</Btn></div>);
  const confirmed=getConfirmed(event);
  const confirmedMembers=confirmed.map(id=>roster.find(r=>r.id===id)).filter(Boolean);
  const winnerIds=lottery.winners||[];
  const dropoutState=getDropouts(event,responses,lottery);
  const dropoutIds=dropoutState?.dropouts||[];
  const winners=roster.filter(r=>(winnerIds.includes(r.id)||winnerIds.includes(r.name))&&!dropoutIds.includes(r.id));
  const dropouts=dropoutIds.map(id=>roster.find(r=>r.id===id)).filter(Boolean);
  const losers=Object.entries(responses).filter(([id,r])=>r.attending&&r.parkingNeeded&&!confirmed.includes(id)).map(([id])=>roster.find(r=>r.id===id)).filter(r=>r&&!winnerIds.includes(r.id)&&!winnerIds.includes(r.name));
  const walkers=Object.entries(responses).filter(([_,r])=>r.attending&&!r.parkingNeeded).map(([id])=>roster.find(r=>r.id===id)).filter(Boolean);
  const absent=Object.entries(responses).filter(([_,r])=>!r.attending).map(([id])=>roster.find(r=>r.id===id)).filter(Boolean);
  const er=getEventRoster(roster,event);
  const noReply=er.filter(r=>!responses[r.id]);

  function genText(){
    const L=[`⚽ 駐車場抽選結果`,`📌 ${event?.title||"未定"}`,`🗓 ${event?.matchDate?fmtDate(event.matchDate):"未定"}`];
    if(event?.location){L.push(`📍 ${event.location}`);L.push(`🗺 ${mapUrl(event.location)}`)}
    L.push("━━━━━━━━━━━━");
    const formatName = (user) => {
      const res = responses[user.id];
      const carpool = res && res.carpoolCapacity > 0 ? `(乗合+${res.carpoolCapacity})` : "";
      return `#${user.num} ${user.name}${carpool}`;
    };
    if(confirmedMembers.length||winners.length){
      L.push(`🚗 【車を出す方】`);
      if(confirmedMembers.length) L.push(` 🔒確定: `+confirmedMembers.map(formatName).join(", "));
      if(winners.length) L.push(` 🎯当選: `+winners.map(formatName).join(", "));
      L.push("━━━━━━━━━━━━");
    }
    if(losers.length){
      L.push(`💧 【落選（乗り合わせ等）】`);
      L.push(` ❌ `+losers.map(l=>`#${l.num} ${l.name}`).join(", "));
      L.push("━━━━━━━━━━━━");
    }
    if(walkers.length){
      L.push(`🚶 【車なし / 徒歩参加】`);
      L.push(` `+walkers.map(a=>`#${a.num} ${a.name}`).join(", "));
      L.push("━━━━━━━━━━━━");
    }
    if(absent.length||noReply.length){
      L.push(`🏠 【欠席 / 未回答】`);
      if(absent.length) L.push(` 欠席: `+absent.map(a=>`#${a.num} ${a.name}`).join(", "));
      if(noReply.length) L.push(` 未回答: `+noReply.map(n=>`#${n.num} ${n.name}`).join(", "));
      L.push("━━━━━━━━━━━━");
    }
    return L.filter(l=>l!==false).join("\n");
  }
  function share(){
    const txt=genText();
    if(navigator.share){navigator.share({text:txt}).catch(()=>{})}
    else{navigator.clipboard.writeText(txt).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),3000)}).catch(()=>{
      const el=document.createElement("textarea");el.value=txt;el.style.position="absolute";el.style.left="-9999px";document.body.appendChild(el);el.select();document.execCommand("copy");document.body.removeChild(el);setCopied(true);setTimeout(()=>setCopied(false),3000);
    })}
  }

  return(<div>
    <BackBar title="🎉 抽選結果" onBack={onBack} label="← 一覧"/>
    {confirmedMembers.length>0&&<div style={S.cardLock}>
      <div style={{fontWeight:900,color:C.sky,marginBottom:12}}>🔒 確定枠 {confirmedMembers.length}名</div>
      {confirmedMembers.map(w=><div key={w.id} style={{display:"flex",alignItems:"center",gap:12,background:"rgba(56,189,248,0.1)",borderRadius:12,padding:"10px 12px",marginBottom:8}}>
        <span style={{fontSize:20}}>🔒</span><span style={{fontWeight:700}}>#{w.num} {w.name}</span>
      </div>)}
    </div>}
    <div style={S.cardAmber}>
      <div style={{fontWeight:900,color:C.amber,marginBottom:12}}>🚗 当選 {winners.length}名</div>
      {winners.length>0?winners.map(w=><div key={w.id} style={{display:"flex",alignItems:"center",gap:12,background:"rgba(245,158,11,0.1)",borderRadius:12,padding:"10px 12px",marginBottom:8}}><span style={{fontSize:20}}>🎊</span><span style={{fontWeight:700}}>#{w.num} {w.name}</span></div>):<p style={{color:C.dim,fontSize:14}}>当選者なし</p>}
    </div>
    {dropouts.length>0&&<div style={{...S.card,borderColor:"rgba(239,68,68,0.4)",background:"rgba(239,68,68,0.05)"}}>
      <div style={{fontWeight:900,color:"#f87171",marginBottom:10}}>⚠️ 当選者キャンセル {dropouts.length}名 / 空き枠 {dropoutState?.openSlots||0}台</div>
      {dropouts.map(d=><div key={d.id} style={{display:"flex",alignItems:"center",gap:8,background:"rgba(239,68,68,0.08)",borderRadius:12,padding:"8px 12px",marginBottom:4}}>
        <span style={{fontSize:16}}>💧</span><span style={{color:"#f87171",fontSize:14}}>#{d.num} {d.name}</span>
      </div>)}
      {dropoutState&&dropoutState.openSlots>0&&dropoutState.eligibleLosers.length>0&&onReLottery&&<Btn variant="yellow" onClick={()=>onReLottery(event.id)} style={{marginTop:10}}>🔄 再抽選を実施（空き{dropoutState.openSlots}枠 / 候補{dropoutState.eligibleLosers.length}名）</Btn>}
    </div>}
    {losers.length>0&&<div style={S.card}><div style={{fontWeight:700,color:C.muted,marginBottom:10}}>😢 落選 {losers.length}名</div>{losers.map(l=><div key={l.id} style={{display:"flex",alignItems:"center",gap:8,background:"rgba(255,255,255,0.04)",borderRadius:12,padding:"8px 12px",marginBottom:4}}><span style={{color:C.dim}}>×</span><span style={{color:C.muted,fontSize:14}}>#{l.num} {l.name}</span></div>)}</div>}
    {walkers.length>0&&<div style={S.card}><div style={{fontWeight:700,color:C.limeLight,marginBottom:8}}>🚶 徒歩参加 {walkers.length}名</div><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{walkers.map(a=><Tag key={a.id} label={`#${a.num} ${a.name}`} color="lime"/>)}</div></div>}
    {absent.length>0&&<div style={S.card}><div style={{fontWeight:700,color:"rgba(248,113,113,0.7)",marginBottom:8}}>🏠 欠席 {absent.length}名</div><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{absent.map(a=><Tag key={a.id} label={`#${a.num} ${a.name}`} color="red"/>)}</div></div>}
    {noReply.length>0&&<div style={S.card}><div style={{fontWeight:700,color:C.dim,marginBottom:8}}>📭 未回答 {noReply.length}名</div><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{noReply.map(n=><Tag key={n.id} label={`#${n.num} ${n.name}`} color="gray"/>)}</div></div>}

    <Btn onClick={share}>{copied?"✅ コピーしました！LINEに貴り付けてください":"📋 結果をLINEに共有する"}</Btn>
  </div>);
}

// ── APP ──
function App(){
  const[screen,setScreen]=useState("loading");
  const[roster,setRoster]=useState([]);
  const[events,setEvents]=useState([]);
  const[allResponses,setAllResponses]=useState({});
  const[allLotteries,setAllLotteries]=useState({});
  const[selectedEventId,setSelectedEventId]=useState(null);
  const[lottParticipants,setLottParticipants]=useState([]);
  const[lottLimit,setLottLimit]=useState(0);
  const[lottIsRerun,setLottIsRerun]=useState(false);
  const[lottMode,setLottMode]=useState("parking");
  const[lottCarpoolPoint,setLottCarpoolPoint]=useState("");
  const[dataLoading,setDataLoading]=useState(true);
  const[syncing,setSyncing]=useState(false);
  const[errorMsg,setErrorMsg]=useState("");
  const editingRef=useRef(false);
  const screenRef=useRef("loading");

  function navigate(s){screenRef.current=s;setScreen(s);try{history.pushState({screen:s},"",`#${s}`)}catch(e){}}

  useEffect(()=>{
    const handler=e=>{const s=e.state?.screen||"home";screenRef.current=s;setScreen(s)};
    window.addEventListener("popstate",handler);
    return()=>window.removeEventListener("popstate",handler);
  },[]);

  async function loadAll(){
    if(editingRef.current)return;
    setSyncing(true);
    const ro=await fbGet("roster");const evList=await fbGet("events");
    if(ro===undefined||evList===undefined){setSyncing(false);setDataLoading(false);setErrorMsg("データベースへのアクセスに失敗しました。");if(screenRef.current==="loading")navigate("error");return}
    const r=Array.isArray(ro)?ro:(ro?Object.values(ro):[]);
    const evs=Array.isArray(evList)?evList:(evList?Object.values(evList):[]);
    let finalRoster=r.map(m=>({...m,grade:m.grade||"4年"}));
    if(ro===null){const def=DEFAULT_ROSTER;await fbSet("roster",def);finalRoster=def}
    setRoster(finalRoster);setEvents(evs);
    if(evs.length>0){
      const[resps,lotts]=await Promise.all([
        Promise.all(evs.map(e=>fbGet(`responses/${e.id}`).then(v=>[e.id,v||{}]))),
        Promise.all(evs.map(e=>fbGet(`lotteries/${e.id}`).then(v=>[e.id,v]))),
      ]);
      setAllResponses(Object.fromEntries(resps));
      setAllLotteries(Object.fromEntries(lotts.filter(([_,v])=>v)));
    }
    setSyncing(false);setDataLoading(false);
    if(screenRef.current==="loading"||screenRef.current==="error")navigate("home");
  }

  useEffect(()=>{loadAll();const t=setInterval(loadAll,30000);return()=>clearInterval(t)},[]);

  async function handleSaveRoster(ro){editingRef.current=false;setRoster(ro);await fbSet("roster",ro)}
  async function handleSaveRoster(ro){editingRef.current=false;setRoster(ro);await fbSet("roster",ro)}
  async function handleSaveEvent(ev){
    editingRef.current=false;
    const next=events.find(e=>e.id===ev.id)?events.map(e=>e.id===ev.id?ev:e):[...events,ev];
    setEvents(next);await fbSet("events",next);
    if(!allResponses[ev.id])setAllResponses(p=>({...p,[ev.id]:{}}));
  }
  async function handleDeleteEvent(id){
    const next=events.filter(e=>e.id!==id);setEvents(next);await fbSet("events",next);
    setAllResponses(p=>{const n={...p};delete n[id];return n});
    setAllLotteries(p=>{const n={...p};delete n[id];return n});
    await Promise.all([fbDel(`responses/${id}`),fbDel(`lotteries/${id}`)]);
  }
  async function handleSubmit(eventId,payload){
    const{memberId,attending,parkingNeeded,carpoolCapacity}=payload;
    const prev=(allResponses[eventId]||{})[memberId]||{};
    const entry={...prev,attending,parkingNeeded,carpoolCapacity,at:Date.now()};
    await fbSet(`responses/${eventId}/${memberId}`,entry);
    setAllResponses(p=>({...p,[eventId]:{...(p[eventId]||{}),[memberId]:entry}}));
  }
  async function handleSaveCarpool(eventId,memberId,carpoolData){
    const current=(allResponses[eventId]||{})[memberId];
    if(!current){alert("先に出欠登録をしてください");return}
    const updated={...current,...carpoolData,at:Date.now()};
    await fbSet(`responses/${eventId}/${memberId}`,updated);
    setAllResponses(p=>({...p,[eventId]:{...(p[eventId]||{}),[memberId]:updated}}));
  }
  async function handleResetResponses(eventId){
    await fbDel(`responses/${eventId}`);await fbDel(`lotteries/${eventId}`);
    setAllResponses(p=>({...p,[eventId]:{}}));
    setAllLotteries(p=>{const n={...p};delete n[eventId];return n});
  }
  async function handleRunLottery(eventId){
    const ev=events.find(e=>e.id===eventId);
    const resp=allResponses[eventId]||{};
    const confirmed=getConfirmed(ev||{});
    const hp=Object.entries(resp).filter(([id,r])=>r.attending&&r.parkingNeeded&&!confirmed.includes(id)).map(([id])=>roster.find(r=>r.id===id)).filter(Boolean);
    if(hp.length===0){alert("駐車場を希望している人がいません");return}
    setSelectedEventId(eventId);setLottParticipants(hp);setLottLimit(getLotterySlots(ev||{}));setLottIsRerun(false);setLottMode("parking");navigate("lottery");
  }
  async function handleReLottery(eventId){
    const ev=events.find(e=>e.id===eventId);
    const resp=allResponses[eventId]||{};
    const lott=allLotteries[eventId];
    if(!lott?.conducted){alert("初回抽選がまだ実施されていません");return}
    const state=getDropouts(ev,resp,lott);
    if(!state||state.openSlots===0){alert("空き枠がありません");return}
    if(state.eligibleLosers.length===0){alert("再抽選の対象となる落選者がいません（全員欠席・駐車場不要等）");return}
    const participants=state.eligibleLosers.map(id=>roster.find(r=>r.id===id)).filter(Boolean);
    setSelectedEventId(eventId);setLottParticipants(participants);setLottLimit(state.openSlots);setLottIsRerun(true);setLottMode("parking");navigate("lottery");
  }
  async function handleCarpoolAmida(eventId,meetingPoint,riderIds,capacity){
    const participants=riderIds.map(id=>roster.find(r=>r.id===id)).filter(Boolean);
    if(participants.length===0){alert("乗合希望者がいません");return}
    setSelectedEventId(eventId);setLottParticipants(participants);setLottLimit(capacity);setLottIsRerun(false);setLottMode("carpool");setLottCarpoolPoint(meetingPoint);navigate("lottery");
  }
  async function handleCompleteLottery(newWinners){
    const prev=allLotteries[selectedEventId];
    let result;
    if(lottMode==="carpool"){
      const carpoolAssignments={...(prev?.carpoolAssignments||{})};
      carpoolAssignments[lottCarpoolPoint]=newWinners;
      result={...(prev||{conducted:true,conductedAt:Date.now(),winners:[],allParticipants:[]}),carpoolAssignments};
      await fbSet(`lotteries/${selectedEventId}`,result);
      setAllLotteries(p=>({...p,[selectedEventId]:result}));
      navigate("event");
      return;
    }
    if(prev?.conducted&&lottIsRerun){
      const prevWinners=prev.winners||[];
      const resp=allResponses[selectedEventId]||{};
      const stillIn=prevWinners.filter(id=>{const r=resp[id];return r&&r.attending&&r.parkingNeeded});
      result={...prev,winners:[...stillIn,...newWinners],lastReLotteryAt:Date.now(),history:[...(prev.history||[{round:1,winners:prev.winners,at:prev.conductedAt}]),{round:(prev.history?.length||1)+1,winners:newWinners,at:Date.now()}]};
    }else{
      result={conducted:true,conductedAt:Date.now(),winners:newWinners,allParticipants:lottParticipants.map(p=>p.id)};
    }
    await fbSet(`lotteries/${selectedEventId}`,result);
    setAllLotteries(p=>({...p,[selectedEventId]:result}));
    navigate("results");
  }

  const selEv=events.find(e=>e.id===selectedEventId)||null;
  const selResp=(selectedEventId&&allResponses[selectedEventId])||{};
  const selLott=(selectedEventId&&allLotteries[selectedEventId])||null;

  if(screen==="loading")return(<div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{textAlign:"center"}}><div style={{fontSize:48,color:C.limeLight,animation:"spFloat 1s ease-in-out infinite"}}>⚽</div><p style={{color:C.muted,marginTop:12,fontSize:14}}>読み込み中...</p></div>
  </div>);

  if(screen==="error")return(<div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{textAlign:"center",padding:"0 20px"}}>
      <div style={{fontSize:48,marginBottom:16}}>⚠️</div>
      <p style={{color:C.rose,fontWeight:700,fontSize:18,marginBottom:8}}>通信エラー</p>
      <p style={{color:C.muted,fontSize:14,marginBottom:8}}>{errorMsg}</p>
      <p style={{color:C.dim,fontSize:12,marginBottom:24,lineHeight:1.6}}>ネットワーク接続を確認してください</p>
      <Btn onClick={()=>{navigate("loading");loadAll()}} style={{maxWidth:200,margin:"0 auto"}}>↻ 再読み込み</Btn>
    </div>
  </div>);

  return(<div style={{minHeight:"100vh",background:`linear-gradient(180deg,${C.bg} 0%,${C.bg2} 100%)`,color:"#fff",padding:"0 16px 80px",position:"relative"}}>
    {syncing&&<div style={{position:"fixed",top:12,right:12,background:"rgba(0,0,0,0.5)",color:C.limeLight,padding:"4px 8px",borderRadius:8,fontSize:11,fontWeight:700,zIndex:100,backdropFilter:"blur(4px)"}}>↻ 同期中</div>}
    <div style={{maxWidth:460,margin:"0 auto",paddingTop:24}}>
      {screen==="home"&&<HomeScreen roster={roster} events={events} allResponses={allResponses} allLotteries={allLotteries} onNav={navigate} onSelectEvent={setSelectedEventId} loading={dataLoading}/>}
      {screen==="event"&&<EventScreen event={selEv} roster={roster} responses={selResp} lottery={selLott}
        onBack={()=>navigate("home")} onSubmit={handleSubmit} onNav={navigate} onCarpoolAmida={handleCarpoolAmida} onSaveCarpool={handleSaveCarpool}
      />}
      {screen==="admin"&&<AdminScreen roster={roster} events={events} allResponses={allResponses} allLotteries={allLotteries}
        onSelectEvent={setSelectedEventId} onSaveEvent={handleSaveEvent} onDeleteEvent={handleDeleteEvent}
        onSaveRoster={handleSaveRoster} onRunLottery={handleRunLottery} onReLottery={handleReLottery} onResetResponses={handleResetResponses}
        onBack={()=>navigate("home")} onNav={navigate}/>
      }
      {screen==="lottery"&&<LotteryScreen event={selEv} participants={lottParticipants} limit={lottLimit} isRerun={lottIsRerun} mode={lottMode} carpoolPoint={lottCarpoolPoint} onComplete={handleCompleteLottery} onBack={()=>navigate(lottMode==="carpool"?"event":"admin")}/>}
      {screen==="results"&&<ResultsScreen event={selEv} roster={roster} responses={selResp} lottery={selLott}
        onReLottery={handleReLottery} onBack={()=>navigate("home")}/>
      }
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
