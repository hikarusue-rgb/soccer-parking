<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>総務省 審議会委員・専門家 ファインダー</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1a2230;--sub:#5b6b80;--line:#e2e8f0;--accent:#1e5aa8;--accent2:#2b7de0;--chip:#eef4fb;--gold:#c8a04a;}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
header{background:linear-gradient(135deg,#123a6b,#1e5aa8);color:#fff;padding:16px 24px}
header h1{margin:0;font-size:19px;font-weight:700}
header p{margin:4px 0 0;font-size:12px;opacity:.85}
.wrap{max-width:1200px;margin:0 auto;padding:16px 24px 70px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ctl label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:var(--chip);cursor:pointer;font-size:12.5px;user-select:none;transition:.12s}
.chip:hover{border-color:var(--accent2)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.tag.on{background:#2b7de0;border-color:#2b7de0}
.row2{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;margin-top:14px}
select,input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
input[type=search]{width:230px}
.slider-row{display:flex;align-items:center;gap:10px;min-width:300px}
.slider-row input[type=range]{flex:1}
.wlab{font-size:12px;color:var(--sub);white-space:nowrap}.wval{font-weight:700;color:var(--accent)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--sub);background:#f0f4f9;position:sticky;top:0;font-weight:700}
tbody tr{cursor:pointer}tbody tr:hover{background:#f3f8ff}
.rank{font-weight:800;font-size:16px;color:var(--accent);width:38px;text-align:center}
.rank.top{color:var(--gold)}
.nm{font-weight:700;font-size:15px}
.org{color:var(--sub);font-size:12.5px}
.rolechip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:#eef4fb;color:var(--accent);margin-left:6px;border:1px solid #d6e6f7}
.rolechip.chair{background:#fbf3df;color:#9a7418;border-color:#ecd9a6}
.rolechip.nc{background:#eaf6ee;color:#1a7a45;border-color:#bfe9cf}
.ttag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:8px;background:#eef2f7;color:#4a5a70;margin:2px 3px 0 0;border:1px solid #e0e6ee}
.score{font-weight:800;font-size:16px}
.bar{height:6px;border-radius:4px;background:#e9eef5;margin-top:4px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2b7de0,#1e5aa8)}
.sub2{font-size:11.5px;color:var(--sub);margin-top:3px}
.pc{font-weight:700}.est{color:#b06a00}
.drawer{position:fixed;top:0;right:0;height:100%;width:460px;max-width:94vw;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.18);transform:translateX(100%);transition:.25s;overflow-y:auto;z-index:50}
.drawer.open{transform:none}
.dhead{background:linear-gradient(135deg,#123a6b,#1e5aa8);color:#fff;padding:20px}
.dhead .nm{font-size:21px;color:#fff}.dhead .org{color:#cfe0f3;font-size:13.5px;margin-top:3px}
.dbody{padding:20px}
.sec{margin-bottom:18px}
.sec h3{font-size:12px;color:var(--sub);letter-spacing:.5px;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.kv{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}.kv b{color:var(--sub);font-weight:600}
.comm{padding:7px 10px;background:#f6f9fd;border-radius:8px;margin-bottom:6px;font-size:13px;border-left:3px solid var(--accent)}
.paper{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:12.5px}
.paper .y{display:inline-block;font-weight:700;color:var(--accent);margin-right:6px}
.paper .j{color:var(--sub);font-size:11.5px}
.lk{display:inline-flex;gap:5px;padding:8px 12px;background:#f0f6fe;border:1px solid #cfe0f3;border-radius:8px;color:var(--accent);text-decoration:none;font-size:13px;margin:0 6px 6px 0;font-weight:600}
.lk:hover{background:#e2eefb}
.close{position:absolute;top:14px;right:16px;color:#fff;font-size:26px;cursor:pointer;line-height:1;opacity:.85}.close:hover{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(10,20,35,.35);opacity:0;pointer-events:none;transition:.25s;z-index:40}.overlay.on{opacity:1;pointer-events:auto}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:10px}
.count{font-size:13px;color:var(--sub)}
.btn{padding:8px 14px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}.btn:hover{background:var(--accent);color:#fff}
.note{font-size:11.5px;color:var(--sub);margin-top:8px}
.mini{font-size:11px;color:var(--sub)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#eafaf0;color:#1a7a45;border:1px solid #bfe9cf;margin-left:6px}
.cf{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:8px;border:1px solid}
.cf.v{background:#eafaf0;color:#1a7a45;border-color:#bfe9cf}
.cf.r{background:#eef4fb;color:#1e5aa8;border-color:#cfe0f3}
.cf.a{background:#f3f4f6;color:#6b7280;border-color:#e2e5ea}
@media(max-width:760px){.hidem{display:none}.wrap{padding:12px}}
</style></head>
<body>
<header>
  <h1>総務省 審議会委員・専門家 ファインダー <span style="font-size:12px;opacity:.8;font-weight:400">v2</span></h1>
  <p>大分野→技術タグで絞り込み、審議会実績×論文実績でランキング。委員でない第一人者も収録。行クリックで発表論文・委員会歴を表示。</p>
</header>
<div class="wrap">
  <div class="panel">
    <div class="ctl"><label>① 大分野</label><div class="chips" id="domChips"></div></div>
    <div class="ctl" style="margin-top:14px"><label>② 技術タグ（複数選択可・任意）</label><div class="chips" id="tagChips"></div></div>
    <div class="row2">
      <div class="ctl"><label>③ 表示人数（最大20）</label><input type="number" id="topN" min="1" max="20" value="5" style="width:84px"></div>
      <div class="ctl"><label>キーワード検索</label><input type="search" id="q" placeholder="氏名・所属・専門"></div>
      <div class="ctl" style="flex:1;min-width:280px"><label>④ 重み付け（審議会実績 ⇔ 論文実績）</label>
        <div class="slider-row"><span class="wlab">審議会 <span class="wval" id="wc">70</span>%</span>
          <input type="range" id="weight" min="0" max="100" value="70">
          <span class="wlab">論文 <span class="wval" id="wp">30</span>%</span></div></div>
      <div class="ctl"><label>絞り込み</label>
        <label style="font-weight:400;font-size:12.5px"><input type="checkbox" id="acadOnly" checked> 大学・研究機関のみ</label><br>
        <label style="font-weight:400;font-size:12.5px"><input type="checkbox" id="incNC" checked> 非委員の専門家も含む</label></div>
      <div class="ctl"><label>データ信頼度</label>
        <select id="conf"><option value="all">すべて表示</option><option value="verified">精査済のみ</option><option value="nonauto">精査済＋参考のみ</option></select></div>
    </div>
  </div>
  <div class="panel">
    <div class="toolbar"><div class="count" id="count"></div><button class="btn" id="csvBtn">CSVエクスポート</button></div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>順位</th><th>氏名 / 所属</th><th class="hidem">主な専門 / タグ</th><th>総合</th><th class="hidem">審議会</th><th class="hidem">論文</th></tr></thead>
      <tbody id="rows"></tbody></table></div>
    <div class="note" id="foot"></div>
  </div>
</div>
<div class="overlay" id="overlay"></div><div class="drawer" id="drawer"></div>

let curDom="すべて", curTags=new Set();
const $=id=>document.getElementById(id);
// domain chips
const dc=$('domChips');
["すべて",...meta.domains].forEach((d,i)=>{
  const c=document.createElement('div');c.className='chip'+(i===0?' on':'');
  c.textContent=d+(d==="すべて"?` (${people.length})`:` (${meta.domain_counts[d]||0})`);
  c.onclick=()=>{curDom=d;[...dc.children].forEach(x=>x.classList.remove('on'));c.classList.add('on');buildTags();render();};
  dc.appendChild(c);
});
function relevantTags(){
  const pool=people.filter(p=>curDom==="すべて"||p.domains.includes(curDom));
  const s={};pool.forEach(p=>p.tags.forEach(t=>s[t]=(s[t]||0)+1));
  return Object.entries(s).sort((a,b)=>b[1]-a[1]);
}
function buildTags(){
  const tc=$('tagChips');tc.innerHTML='';curTags.clear();
  relevantTags().forEach(([t,n])=>{
    const c=document.createElement('div');c.className='chip tag';c.textContent=`${t} (${n})`;
    c.onclick=()=>{if(curTags.has(t)){curTags.delete(t);c.classList.remove('on');}else{curTags.add(t);c.classList.add('on');}render();};
    tc.appendChild(c);
  });
}
$('weight').oninput=()=>{const w=+$('weight').value;$('wc').textContent=w;$('wp').textContent=100-w;render();};
['topN','q','acadOnly','incNC','conf'].forEach(id=>$(id).addEventListener('input',render));
function scored(){
  const w=+$('weight').value/100, q=$('q').value.trim(), cf=$('conf').value;
  let list=people.filter(p=>curDom==="すべて"||p.domains.includes(curDom));
  if(curTags.size) list=list.filter(p=>p.tags.some(t=>curTags.has(t)));
  if($('acadOnly').checked) list=list.filter(p=>p.academic);
  if(!$('incNC').checked) list=list.filter(p=>!p.non_committee);
  if(cf==="verified") list=list.filter(p=>p.confidence==="verified");
  else if(cf==="nonauto") list=list.filter(p=>p.confidence!=="auto");
  if(q) list=list.filter(p=>(p.name+p.affiliation+p.specialty+p.tags.join()).includes(q));
  list.forEach(p=>p._total=Math.round((w*p.council_score+(1-w)*p.paper_score)*10)/10);
  list.sort((a,b)=>b._total-a._total||b.council_score-a.council_score);
  return list;
}
function render(){
  const list=scored(), N=Math.min(20,Math.max(1,+$('topN').value||5)), top=list.slice(0,N);
  const rows=$('rows');rows.innerHTML='';
  top.forEach((p,i)=>{
    const tr=document.createElement('tr');
    const chair=p.is_chair?'<span class="rolechip chair">主査/座長</span>':'';
    const nc=p.non_committee?'<span class="rolechip nc">非委員(第一人者)</span>':'';
    const cf=p.confidence==='verified'?'<span class="cf v">精査済</span>':(p.confidence==='reference'?'<span class="cf r">参考</span>':'<span class="cf a">自動収録</span>');
    const tags=p.tags.slice(0,4).map(t=>`<span class="ttag">${t}</span>`).join('');
    const est=p.paper_estimated?'<span class="est" title="推定">*</span>':'';
    tr.innerHTML=`<td class="rank ${i<3?'top':''}">${i+1}</td>
      <td><div class="nm">${p.name}${chair}${nc}</div><div class="org">${p.affiliation}</div>
      <div class="sub2">${cf} ・ ${p.non_committee?'委員会参加なし':'委員会 '+p.n_committees+' 件'} ・ 論文 <span class="pc">${p.paper_count}</span>${est} 件</div></td>
      <td class="hidem"><div style="max-width:250px">${p.specialty}<div>${tags}</div></div></td>
      <td><div class="score">${p._total}</div><div class="bar"><i style="width:${p._total}%"></i></div></td>
      <td class="hidem">${p.council_score}</td><td class="hidem">${p.paper_score}</td>`;
    tr.onclick=()=>openDrawer(p,i+1);rows.appendChild(tr);
  });
  $('count').textContent=`【${curDom}${curTags.size?' / '+[...curTags].join('・'):''}】該当 ${list.length} 名中 上位 ${top.length} 名`;
  $('foot').textContent=meta.note+"（* は論文数推定）";
  window._top=top;
}
function openDrawer(p,rank){
  const links=[['researchmap',p.researchmap],['Google Scholar',p.scholar],['CiNii',p.cinii],['Web検索',p.google]]
    .map(([t,u])=>`<a class="lk" href="${u}" target="_blank" rel="noopener">🔗 ${t}</a>`).join('');
  const comms=p.committees.length?p.committees.map(c=>`<div class="comm"><b>${c.name}</b> <span class="rolechip${['主査','会長','分科会長','部会長'].includes(c.role)?' chair':''}">${c.role}</span></div>`).join(''):'<div class="mini">現在この審議会群での委員就任は確認されていません（学術実績で候補入り）。</div>';
  const papers=p.papers&&p.papers.length?p.papers.map(x=>`<div class="paper"><span class="y">${x.y}</span>${x.t}<div class="j">${x.j||''}</div></div>`).join(''):`<div class="mini">researchmap未登録のためリンクから確認してください。</div>`;
  const est=p.paper_estimated?' <span class="est">（推定）</span>':'';
  $('drawer').innerHTML=`<div class="dhead"><span class="close" onclick="closeDrawer()">×</span>
      <div class="mini">ランキング ${rank}位 ${p.non_committee?'／非委員の第一人者':''} ／ ${p.confidence==='verified'?'精査済データ':(p.confidence==='reference'?'参考(公開情報ベース・未精査)':'自動収録(名簿から抽出・所属等要確認)')}</div>
      <div class="nm">${p.name}</div><div class="org">${p.affiliation}</div></div>
    <div class="dbody">
      <div class="sec"><h3>スコア</h3>
        <div class="kv"><b>総合</b><span style="font-weight:800;color:#1e5aa8;font-size:18px">${p._total}</span></div>
        <div class="kv"><b>審議会実績</b><span>${p.council_score}</span></div>
        <div class="kv"><b>論文実績</b><span>${p.paper_score}（登録論文 ${p.paper_count}件${est}）</span></div></div>
      <div class="sec"><h3>専門分野・タグ</h3><div>${p.specialty}</div>
        <div style="margin-top:6px">${p.tags.map(t=>`<span class="ttag">${t}</span>`).join('')}</div>
        <div class="sub2" style="margin-top:6px">大分野: ${p.domains.join(' / ')}</div></div>
      <div class="sec"><h3>参加委員会（${p.n_committees}件）</h3>${comms}</div>
      <div class="sec"><h3>発表論文（最新）</h3>${papers}</div>
      <div class="sec"><h3>論文・研究リンク</h3>${links}</div></div>`;
  $('drawer').classList.add('open');$('overlay').classList.add('on');
}
function closeDrawer(){$('drawer').classList.remove('open');$('overlay').classList.remove('on');}
$('overlay').onclick=closeDrawer;document.onkeydown=e=>{if(e.key==='Escape')closeDrawer();};
$('csvBtn').onclick=()=>{
  const w=+$('weight').value;
  const head=['順位','氏名','所属','信頼度','専門','タグ','総合','審議会','論文スコア','論文数','委員会数','委員会(役割)','researchmap'];
  const lines=[head.join(',')];
  const CF={verified:'精査済',reference:'参考',auto:'自動収録'};
  (window._top||[]).forEach((p,i)=>{
    const comm=p.committees.map(c=>c.name+'('+c.role+')').join(' / ');
    lines.push([i+1,p.name,p.affiliation,CF[p.confidence]||p.confidence,p.specialty,p.tags.join('・'),p._total,p.council_score,p.paper_score,p.paper_count,p.n_committees,comm,p.researchmap]
      .map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','));
  });
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`委員リスト_${curDom}_審${w}論${100-w}.csv`;a.click();
};
buildTags();render();
</script></body></html>
