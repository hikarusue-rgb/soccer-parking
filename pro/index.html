  return true;
}

function fmtDate(iso){if(!iso)return"";return new Date(iso).toLocaleDateString("ja-JP",{month:"short",day:"numeric",weekday:"short"})}
function fmtDateTime(iso){if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString("ja-JP",{month:"short",day:"numeric",weekday:"short"})+" "+d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}
function getTimeLeft(dl){const d=new Date(dl)-new Date();if(d<=0)return null;const h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000);if(h>=24)return`${Math.floor(h/24)}日後`;if(h>0)return`${h}時間${m}分`;return`${m}分`}

function getConfirmed(ev){return ev.confirmedParking||[]}
function getLotterySlots(ev){return Math.max(0,(ev.parkingLimit||0)-getConfirmed(ev).length)}
function getEventMode(ev){return ev?.mode||(ev?.carpoolEnabled?"carpool":"simple")}

function computeDriverCost(ev,settings,numPassengers){
  if(!ev||!ev.roundTripKm)return null;
  const km=parseFloat(ev.roundTripKm)||0;
  const toll=parseInt(ev.tollFee)||0;
  const fe=parseFloat(settings.fuelEconomy)||10;
  const gp=parseFloat(settings.gasPrice)||170;
  const hf=parseInt(settings.handlingFee)||0;
  const gas=Math.round(km/fe*gp);
  const total=gas+toll+hf;
  const perPassenger=numPassengers>0?Math.ceil(total/numPassengers/100)*100:null;
  return{gas,toll,handlingFee:hf,total,perPassenger,numPassengers};
}
function computeCarpoolPlan(ev,resp){
  const attendees=Object.entries(resp||{}).filter(([id,r])=>r&&r.attending);
  const attendeeIds=attendees.map(([id])=>id);
  const N=attendeeIds.length;
  if(N===0)return null;
  const confirmedSet=new Set(getConfirmed(ev||{}));
  // Drivers = attendees with parkingNeeded=true (intent to bring car)
  // Their "total people they can carry" = 1 (self) + carpoolCapacity
  const drivers=attendees
    .filter(([id,r])=>r.parkingNeeded)
    .map(([id,r])=>({id,cap:r.carpoolCapacity||0,total:1+(r.carpoolCapacity||0),isConfirmed:confirmedSet.has(id)}))
    .sort((a,b)=>{
      // Confirmed first, then by capacity desc
      if(a.isConfirmed!==b.isConfirmed)return a.isConfirmed?-1:1;
      return b.total-a.total;
    });
  const parkingLimit=ev?.parkingLimit||0;
  const selected=[];
  let coveredCount=0;
  for(const d of drivers){
    if(selected.length>=parkingLimit)break;
    if(coveredCount>=N&&!d.isConfirmed)break;
    selected.push(d);
    coveredCount+=d.total;
  }
  const driverIdSet=new Set(selected.map(d=>d.id));
  const passengersToAssign=attendeeIds.filter(id=>!driverIdSet.has(id));
  const assignments={};
  selected.forEach(d=>{assignments[d.id]=[]});
  const unassigned=[];
  for(const pid of passengersToAssign){
    let placed=false;
    for(const d of selected){
      if(assignments[d.id].length<d.cap){
        assignments[d.id].push(pid);
        placed=true;
        break;
      }
    }
    if(!placed)unassigned.push(pid);
  }
  return{selectedDrivers:selected.map(d=>({id:d.id,capacity:d.cap})),assignments,unassigned,coveredCount,attendeeCount:N};
}
function getDropouts(ev,resp,lott){
  if(!lott?.conducted)return null;
  const winners=lott.winners||[];
  const dropouts=winners.filter(id=>{const r=resp[id];return !r||!r.attending||!r.parkingNeeded});
  const effectiveWinners=winners.filter(id=>!dropouts.includes(id));
  const openSlots=Math.max(0,getLotterySlots(ev)-effectiveWinners.length);
  const allParticipants=lott.allParticipants||[];
  const eligibleLosers=allParticipants.filter(id=>{
    if(winners.includes(id))return false;
    const r=resp[id];
    return r&&r.attending&&r.parkingNeeded;
  });
  return{dropouts,effectiveWinners,openSlots,eligibleLosers};
}
function computeCarpoolMatching(ev,resp,lott){
  if(getEventMode(ev)!=="carpool"||!lott?.conducted)return null;
  const confirmed=getConfirmed(ev);
  const winners=lott.winners||[];
  const drivers=[...confirmed,...winners].map(id=>{
    const r=resp[id];
    if(!r||!r.attending)return null;
    if(!r.carpoolCapacity||r.carpoolCapacity<=0)return null;
    return{id,meetingPoint:(r.meetingPoint||"").trim(),capacity:r.carpoolCapacity};
  }).filter(d=>d&&d.meetingPoint);
  const allParts=lott.allParticipants||[];
  const losers=allParts.filter(id=>!winners.includes(id)&&!confirmed.includes(id)).filter(id=>{const r=resp[id];return r&&r.attending&&r.parkingNeeded});
  const points={};
  drivers.forEach(d=>{
    if(!points[d.meetingPoint])points[d.meetingPoint]={drivers:[],riders:[],totalCapacity:0};
    points[d.meetingPoint].drivers.push(d);
    points[d.meetingPoint].totalCapacity+=d.capacity;
  });
  losers.forEach(id=>{
    const r=resp[id];
    const wishes=(r.carpoolWishes||[]).filter(Boolean);
    wishes.forEach(w=>{
      const key=w.trim();
      if(points[key]){points[key].riders.push({id,wishes})}
    });
  });
  const assignments=(lott.carpoolAssignments)||{};
  const result=[];
  Object.entries(points).forEach(([mp,data])=>{
    if(data.riders.length===0)return;
    const uniqueRiders=[...new Map(data.riders.map(r=>[r.id,r])).values()];
    const overflow=uniqueRiders.length>data.totalCapacity;
    let assigned=assignments[mp]||null;
    if(!overflow&&!assigned){assigned=uniqueRiders.map(r=>r.id)}
    result.push({meetingPoint:mp,drivers:data.drivers,totalCapacity:data.totalCapacity,riders:uniqueRiders,overflow,assigned});
  });
  const unmatched=losers.filter(id=>{
    const r=resp[id];
    const wishes=(r.carpoolWishes||[]).filter(Boolean);
    if(wishes.length===0)return false;
    return !wishes.some(w=>{const k=w.trim();return points[k]&&points[k].drivers.length>0});
  });
  return{points:result,unmatched,drivers,losers};
}
function mapUrl(loc){return loc?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc)}`:""}
function parkingUrl(loc){return loc?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc+" コインパーキング")}`:""}
function pad2(n){return n<10?"0"+n:""+n}
function applyTime(date,timeStr){
  const d=new Date(date);
  if(timeStr){const[h,m]=timeStr.split(":");d.setHours(parseInt(h)||0,parseInt(m)||0,0,0)}
  return d;
}
function fmtICSLocal(d){return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`}
function genICS(ev){
  if(!ev.matchDate)return null;
  const startTime=ev.meetTime||ev.kickoffTime;
  const start=applyTime(ev.matchDate,startTime);
  let end;
  if(ev.endTime){end=applyTime(ev.matchDate,ev.endTime)}
  else{end=new Date(start);end.setHours(end.getHours()+2)}
  const summary=(ev.opponent&&ev.opponent!==ev.title)?`🏆 ${ev.title} vs ${ev.opponent}`:`🏆 ${ev.title}`;
  const descLines=[];
  if(ev.opponent&&ev.opponent!==ev.title)descLines.push(`対戦相手: ${ev.opponent}`);
  if(ev.meetTime)descLines.push(`集合: ${ev.meetTime}`);
  if(ev.kickoffTime)descLines.push(`KO: ${ev.kickoffTime}`);
  if(ev.endTime)descLines.push(`終了予定: ${ev.endTime}`);
  if(ev.uniformColor)descLines.push(`ユニフォーム: ${ev.uniformColor}`);
  if(ev.notes)descLines.push(`備考: ${ev.notes}`);
  if(ev.location)descLines.push(`地図: ${mapUrl(ev.location)}`);
  const esc=(s)=>String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
  const now=new Date();
  const dtstamp=`${now.getUTCFullYear()}${pad2(now.getUTCMonth()+1)}${pad2(now.getUTCDate())}T${pad2(now.getUTCHours())}${pad2(now.getUTCMinutes())}${pad2(now.getUTCSeconds())}Z`;
  const lines=[
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Soccer Parking//Match//JA",
    "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    `UID:${ev.id||"event"}@soccer-parking`,
    `DTSTAMP:${dtstamp}`,
    `DTSTART:${fmtICSLocal(start)}`,
    `DTEND:${fmtICSLocal(end)}`,
    `SUMMARY:${esc(summary)}`,
    ev.location?`LOCATION:${esc(ev.location)}`:null,
    descLines.length?`DESCRIPTION:${esc(descLines.join("\n"))}`:null,
    "END:VEVENT",
    "END:VCALENDAR"
  ].filter(Boolean);
  return lines.join("\r\n");
}
function downloadICS(ev){
  const ics=genICS(ev);
  if(!ics){alert("試合日時を設定してからカレンダー追加できます");return}
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=(ev.title||"event").replace(/[^\w぀-ヿ一-龯-]/g,"_")+".ics";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function googleCalendarUrl(ev){

  let end;

  const summary=(ev.opponent&&ev.opponent!==ev.title)?`🏆 ${ev.title} vs ${ev.opponent}`:`🏆 ${ev.title}`;
  const descLines=[];
  if(ev.opponent&&ev.opponent!==ev.title)descLines.push(`対戦相手: ${ev.opponent}`);
  if(ev.meetTime)descLines.push(`集合: ${ev.meetTime}`);
  if(ev.kickoffTime)descLines.push(`KO: ${ev.kickoffTime}`);
  if(ev.endTime)descLines.push(`終了予定: ${ev.endTime}`);

  if(ev.notes)descLines.push(`備考: ${ev.notes}`);
  if(ev.location)descLines.push(`地図: ${mapUrl(ev.location)}`);
  const dates=`${fmtICSLocal(start)}/${fmtICSLocal(end)}`;
  const params=new URLSearchParams({
    action:"TEMPLATE",
    text:summary,
    dates,
    details:descLines.join("\n"),
    location:ev.location||"",
    ctz:"Asia/Tokyo",
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}
function parseLineMessage(text){
  if(!text)return{};
  const result={};
  // 全角→半角の正規化（数字・記号・PM/AM）+ 行頭の箇条書き記号を除去
  let t=text
    .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[：]/g,":").replace(/[／]/g,"/").replace(/[＝]/g,"=").replace(/[＠]/g,"@")
    .replace(/[Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/^[\s■・▼▽◆◇●○◯◎★☆▶▷▪▫►]+/gm,""); // 行頭の箇条書き
  // PM/AM 表記を24時間化（ＰＭ１：００ → 13:00）
  // 周囲のスペースは温存（時刻と次のキーワードの隣接性を保つ）
  t=t.replace(/(?:pm|PM|午後)\s*(\d{1,2})\s*[:時]?\s*(\d{0,2})/gi,(m,h,mi)=>{
    const hh=(parseInt(h)%12)+12;return `${hh}:${pad2(parseInt(mi||"0"))}`;
  }).replace(/(?:am|AM|午前)\s*(\d{1,2})\s*[:時]?\s*(\d{0,2})/gi,(m,h,mi)=>{
    const hh=parseInt(h)%12;return `${pad2(hh)}:${pad2(parseInt(mi||"0"))}`;
  });
  const validTime=(h,m)=>h>=0&&h<=23&&m>=0&&m<=59;
  const toHM=(h,m)=>`${pad2(h)}:${pad2(m)}`;
  // 日付: M/D, M月D日, M-D など
  let dateMatch=t.match(/(\d{1,2})\s*[\/月\.\-]\s*(\d{1,2})(?:日)?/);
  let parsedDate=null;
  if(dateMatch){
    const m=parseInt(dateMatch[1]),d=parseInt(dateMatch[2]);
    if(m>=1&&m<=12&&d>=1&&d<=31){
      const now=new Date();
      let y=now.getFullYear();
      const candidate=new Date(y,m-1,d);
      if(candidate<new Date(now.getTime()-86400000))y++;
      parsedDate={y,m,d};
    }
  }
  // スケジュール／予定 セクション → 備考（最優先で行頭マッチを探す）
  const schedRegex=/(?:^|\n)\s*(スケジュール|タイムスケジュール|タイテ|タイムテーブル|試合予定|対戦予定|試合順|対戦表|試合スケジュール)\s*\n/;
  const schedMatchExec=schedRegex.exec(text);
  let schedMatchIdx=-1;
  if(schedMatchExec){
    schedMatchIdx=schedMatchExec.index+(schedMatchExec[0].match(/^\s*\n/)?schedMatchExec[0].indexOf(schedMatchExec[1]):0);
    result.notes=text.substring(schedMatchIdx).trim();
  }
  // スケジュール部分を除外したテキスト（対戦相手抽出用：「vs A」が予定欄に含まれてもタイトル化しない）
  const tBeforeSched=schedMatchIdx>=0?text.substring(0,schedMatchIdx):text;
  const tMainNorm=tBeforeSched
    .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[：]/g,":").replace(/[／]/g,"/").replace(/[＝]/g,"=").replace(/[＠]/g,"@")
    .replace(/[Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/^[\s■・▼▽◆◇●○◯◎★☆▶▷▪▫►]+/gm,"");
  // リーグ戦・大会・杯などのタイトル検出（最優先）
  // 文字クラスを拡張：○●◯△□★☆- 等の記号も含む（「○○カップ」「U-10リーグ」等に対応）
  const leagueMatch=tMainNorm.match(/([^\s\n,、。「『【\(（\)）\[\]【】|=:：]+(?:リーグ|大会|杯|フェスタ|フェスティバル|トーナメント|カップ|交流戦))/);
  if(leagueMatch)result.title=leagueMatch[1].trim();
  // 対戦相手（リーグ戦未検出時のみ）：スケジュール部分を除いたテキストから抽出
  if(!result.title){
    const vsPatterns=[
      /(?:対戦相手|対戦チーム|お相手|対戦|相手|本日の?相手)\s*[:：・\-=]?\s*([^\s\n,、。\(（様]+(?:FC|SC|サッカー|サッカークラブ)?)/,
      /(?:vs\.?|VS\.?)\s*([^\s\n,、。\(（様]+(?:FC|SC|サッカー)?)/i,
      /([^\s\n,、。\(（]+(?:FC|SC))\s*戦/, // 「太陽FC戦」
      /対\s+([^\s\n,、。\(（様]+(?:FC|SC|サッカー)?)/,
    ];
    for(const re of vsPatterns){
      const m=tMainNorm.match(re);
      if(m){
        const opp=m[1].trim().replace(/[様さま]+$/,"");
        if(opp&&!["の","に","は","を","と","練習試合","TM"].includes(opp)){
          result.opponent=opp;
          result.title=opp;
          break;
        }
      }
    }
  }
  // タイトルのフォールバック：「練習試合」「TM」キーワード
  if(!result.title){
    if(/練習試合/.test(tMainNorm))result.title="練習試合";
    else if(/\bTM\b/.test(tMainNorm)||/(?:^|\s)TM(?:$|\s)/.test(tMainNorm))result.title="TM";
  }
  // 会場
  const locPatterns=[
    /(?:会場|場所|於)\s*[:：・\-=]?\s*([^\n\(（,、]+?)(?=\s*(?:集合|キックオフ|KO|ko|ユニ|終了|解散|相手|対戦|配車|vs|VS|対\s|$|\n|時|\d))/,
    /@\s*([^\n\(（,、\s]+)/,
    /(?:^|\n)\s*([^\s\n,、]+(?:グラウンド|グランド|公園|小学校|中学校|高校|球場|サッカー場|フィールド|スタジアム|体育館|G|ｸﾞﾗｳﾝﾄﾞ))(?=\s|$|\n)/,
  ];
  for(const re of locPatterns){
    const m=tMainNorm.match(re);
    if(m){
      let loc=m[1].trim().replace(/[「『【［\[\(]/g,"").replace(/[」』】］\]\)]/g,"");
      loc=loc.replace(/\s+[白黒紺青赤緑黄橙桃](?:ユニ|シャツ)?\s*$/,"").trim();
      loc=loc.replace(/\s*\d{1,2}[:時].*$/,"").trim(); // 末尾の時刻除去
      if(loc.length>0&&loc.length<60){result.location=loc;break}
    }
  }
  // 集合時刻（優先順位順に試行）
  const meetPatterns=[
    /(\d{1,2})[:時](\d{0,2})分?集合/, // [1] 「9:00集合」「9時集合」（スペース無し）
    /集合(?:は|が|時刻)?[ \t]*[:：\s=]*[ \t]*(\d{1,2})[:時](?:(\d{1,2})\s*分?)?(?![:\d時])/, // [2] 「集合 8:30」「集合8時30分」
    /(\d{1,2})[:時](\d{0,2})分?[ \t]+集合/, // [3] 「9:00 集合」「8時 集合」（改行不可）
  ];
  for(const re of meetPatterns){
    const m=t.match(re);
    if(m){
      const h=parseInt(m[1]),mi=parseInt(m[2]||"0");
      if(validTime(h,mi)){result.meetTime=toHM(h,mi);break}
    }
  }
  // 時刻レンジ「9:30-12:00」「10:30〜12:30」「9時〜12時」（KO + 終了として採用）
  // 日付のM-D（X/Y）と混同しないため、両側がXX:XX形式か X時 形式に限定
  const rangePatterns=[
    /(\d{1,2}):(\d{2})\s*[-〜～]\s*(\d{1,2}):(\d{2})/,
    /(\d{1,2})\s*時\s*(\d{0,2})\s*分?\s*[-〜～]\s*(\d{1,2})\s*時\s*(\d{0,2})\s*分?/,
  ];
  let rangeMatch=null;
  for(const re of rangePatterns){const m=t.match(re);if(m){rangeMatch=m;break}}
  if(rangeMatch){
    const h1=parseInt(rangeMatch[1]),m1=parseInt(rangeMatch[2]||"0"),h2=parseInt(rangeMatch[3]),m2=parseInt(rangeMatch[4]||"0");
    if(validTime(h1,m1)&&validTime(h2,m2)){
      result.kickoffTime=toHM(h1,m1);
      result.endTime=toHM(h2,m2);
    }
  }
  // キックオフ（レンジで取れていなければ）
  if(!result.kickoffTime){
    const koPatterns=[
      /(\d{1,2})[:時](\d{0,2})分?(?:KO|ko|キックオフ|試合開始|開始)/, // [1] 「9:00KO」「9時KO」（スペース無し）
      /(?:KO|ko|キックオフ|試合開始|開始)[ \t]*[:：\s=]*[ \t]*(\d{1,2})[:時](?:(\d{1,2})\s*分?)?(?![:\d時])/, // [2] 「KO 9:00」
      /(\d{1,2})[:時](\d{0,2})分?[ \t]+(?:KO|ko|キックオフ|試合開始|開始)/, // [3] 「9:00 KO」「9時 開始」（改行不可）
    ];
    let koMatch=null;
    for(const re of koPatterns){const m=t.match(re);if(m){koMatch=m;break}}
    // スケジュール直後の最初の「X時〜」「X:XX〜」を採用
    if(!koMatch&&schedMatchIdx>=0){
      const afterSched=t.substring(schedMatchIdx);
      koMatch=afterSched.match(/(\d{1,2})[:時](\d{0,2})\s*分?\s*[〜～\-から]/);
    }
    if(!koMatch)koMatch=t.match(/(\d{1,2})[:時](\d{0,2})\s*分?\s*[〜～から]/);
    if(koMatch){
      const h=parseInt(koMatch[1]),m=parseInt(koMatch[2]||"0");
      if(validTime(h,m))result.kickoffTime=toHM(h,m);
    }
  }
  // 終了予定（レンジで取れていなければ）
  if(!result.endTime){
    const endMatch=t.match(/(?:終了|解散|終わり|終了予定)\s*予?定?\s*[:：\s=]*(\d{1,2})\s*[:時]\s*(\d{0,2})\s*分?/);
    if(endMatch){
      const h=parseInt(endMatch[1]),m=parseInt(endMatch[2]||"0");
      if(validTime(h,m))result.endTime=toHM(h,m);
    }
  }
  // ユニフォーム
  let uniMatch=t.match(/([白黒紺青赤緑黄橙桃])(?:ユニ|シャツ|の?ユニフォーム)/);
  if(!uniMatch)uniMatch=t.match(/(?:ユニ(?:フォーム)?|シャツ)\s*[:：\s=]+([白黒紺青赤緑黄橙桃ピンクオレンジ]+|\S+)/);
  if(uniMatch){
    const v=uniMatch[1].trim();
    if(!["で","に","の","は","を","と"].includes(v))result.uniformColor=v;
  }
  // matchDate
  if(parsedDate){
    const tm=result.kickoffTime||result.meetTime||"09:00";
    result.matchDate=`${parsedDate.y}-${pad2(parsedDate.m)}-${pad2(parsedDate.d)}T${tm}`;
  }
  return result;
}
function fmtMatchDetails(ev){
  const lines=[];
  if(ev.opponent&&ev.opponent!==ev.title)lines.push(`🆚 ${ev.opponent}`);
  if(ev.location){
    lines.push(`📍 ${ev.location}`);
    lines.push(`🗺 ${mapUrl(ev.location)}`);
  }
  if(ev.meetTime||ev.kickoffTime||ev.endTime){
    const parts=[];
    if(ev.meetTime)parts.push(`集合${ev.meetTime}`);
    if(ev.kickoffTime)parts.push(`KO${ev.kickoffTime}`);
    if(ev.endTime)parts.push(`終了${ev.endTime}`);
    lines.push(`⏰ ${parts.join(" / ")}`);
  }
  if(ev.uniformColor)lines.push(`👕 ${ev.uniformColor}`);
  if(ev.notes)lines.push(`📝 ${ev.notes}`);
  if(ev.attachments&&ev.attachments.length){
    lines.push(`📎 資料:`);
    ev.attachments.forEach(a=>lines.push(`  ${a.name||"リンク"}: ${a.url}`));
  }
  return lines.length?lines.join("\n"):"";
}

function HomeScreen({roster,events,allResponses,allLotteries,onNav,onSelectEvent,loading,teamMeta,maintenanceNotice}){
  const[,tick]=useState(0);
  useEffect(()=>{const t=setInterval(()=>tick(x=>x+1),30000);return()=>clearInterval(t)},[]);
  const now=new Date();
  const sortedAsc=[...events].sort((a,b)=>new Date(a.matchDate||"2099-12-31")-new Date(b.matchDate||"2099-12-31"));
  const future=sortedAsc.filter(e=>!e.matchDate||new Date(e.matchDate)>=new Date(now-86400000));
  const featured=future[0]||null;
  const upcomingOthers=future.slice(1);
  const archive=[...events].filter(e=>e.matchDate&&new Date(e.matchDate)<new Date(now-86400000)).sort((a,b)=>new Date(b.matchDate)-new Date(a.matchDate));
  const[showArchive,setShowArchive]=useState(false);
  const[showUpcoming,setShowUpcoming]=useState(false);

  function renderEvent(ev){
    const er=getEventRoster(roster,ev);
    const resp=allResponses[ev.id]||{};
    const lott=allLotteries[ev.id]||null;
    const answered=Object.keys(resp).filter(id=>er.find(r=>r.id===id)).length;
    const hopefuls=Object.values(resp).filter(r=>r.attending&&r.parkingNeeded).length;
    const confirmed=getConfirmed(ev).length;
    const lottSlots=getLotterySlots(ev);
    const isPast=ev.deadline&&now>new Date(ev.deadline);
    const tl=ev.deadline&&!isPast?getTimeLeft(ev.deadline):null;
    let badge=null,bc=C.cardBorder;
    if(lott?.conducted){badge=<Tag label="✅ 抽選完了" color="lime"/>;bc="rgba(147,197,253,0.4)"}
    else if(isPast&&hopefuls>lottSlots&&lottSlots>0){badge=<Tag label="⚠️ 抽選待ち" color="amber"/>;bc="rgba(245,158,11,0.4)"}
    else if(isPast&&hopefuls>0&&hopefuls<=lottSlots){badge=<Tag label="✅ 全員OK" color="lime"/>;bc="rgba(147,197,253,0.3)"}
    else if(isPast){badge=<Tag label="締切済" color="gray"/>}
    else if(tl){badge=<Tag label={`⏱ ${tl}`} color="sky"/>}
    return(
      <div key={ev.id} className="fade-in" style={{...S.card,borderColor:bc,cursor:"pointer"}} onClick={()=>{onSelectEvent(ev.id);onNav("event")}}>
        <div style={{...S.row,marginBottom:10}}>
          <div><div style={{fontWeight:900,fontSize:16}}>{ev.title}</div>
            {ev.matchDate&&<div style={{color:C.limeLight,fontSize:12,fontWeight:700,marginTop:2}}>🗓 {fmtDate(ev.matchDate)}</div>}
          </div>{badge}
        </div>
        {(ev.opponent||ev.location||ev.meetTime||ev.kickoffTime||ev.endTime||ev.uniformColor)&&<div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:8,fontSize:12,color:C.muted}}>
          {ev.opponent&&ev.opponent!==ev.title&&<span>🆚 {ev.opponent}</span>}
          {ev.location&&<span>📍 {ev.location}</span>}
          {(ev.meetTime||ev.kickoffTime||ev.endTime)&&<span>⏰ {[ev.meetTime&&`集合${ev.meetTime}`,ev.kickoffTime&&`KO${ev.kickoffTime}`,ev.endTime&&`終了${ev.endTime}`].filter(Boolean).join(" / ")}</span>}
          {ev.uniformColor&&<span>👕 {ev.uniformColor}</span>}
        </div>}
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <div style={S.stat}><div style={{fontSize:18,fontWeight:900}}>{answered}<span style={{fontSize:11,color:C.dim}}>/{er.length}名</span></div><div style={{fontSize:11,color:C.muted}}>回答済み</div></div>
          <div style={S.stat}><div style={{fontSize:18,fontWeight:900,color:C.amber}}>{hopefuls}</div><div style={{fontSize:11,color:C.muted}}>駐車場希望</div></div>
          <div style={S.stat}><div style={{fontSize:18,fontWeight:900,color:C.sky}}>{ev.parkingLimit||0}</div><div style={{fontSize:11,color:C.muted}}>台まで可</div></div>
        </div>
        {confirmed>0&&<div style={{fontSize:11,color:C.sky,marginBottom:4}}>🔒 確定枠{confirmed}台 ／ 抽選枠{lottSlots}台</div>}
        {ev.deadline&&<div style={{fontSize:11,color:C.dim}}>締切: {fmtDateTime(ev.deadline)}</div>}
      </div>
    );
  }

  return(<div>
    <div style={{textAlign:"center",padding:"28px 0 20px"}}>
      <div style={{fontSize:52,marginBottom:10,display:"inline-block",animation:"spFloat 3s ease-in-out infinite"}}>🏆</div>
      <h1 style={{fontSize:26,fontWeight:900,margin:0}}>駐車場 抽選</h1>
      {teamMeta?.name?<p style={{color:C.limeLight,fontWeight:700,marginTop:4,fontSize:14}}>🏆 {teamMeta.name}</p>:<p style={{color:C.limeLight,fontWeight:700,marginTop:4,fontSize:13}}>Sports Parking Lottery</p>}
    </div>
    {maintenanceNotice&&<MaintenanceBanner notice={maintenanceNotice} style={{marginBottom:16}}/>}
    {loading?<div style={{textAlign:"center",padding:"40px 0",color:C.muted}}>読み込み中...</div>
    :!featured&&archive.length===0?<div style={{...S.card,textAlign:"center",padding:"32px 16px"}}>
      <div style={{fontSize:40,marginBottom:12}}>📅</div>
      <p style={{color:C.muted,marginBottom:6}}>試合がまだ登録されていません</p>
      <p style={{color:C.dim,fontSize:12}}>管理者が試合を追加するまでお待ちください</p>
    </div>
    :<>
      {featured&&<>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,paddingLeft:4}}>
          <span style={{fontSize:18}}>🌟</span>
          <span style={{fontSize:13,fontWeight:900,color:C.limeLight}}>次の試合</span>
        </div>
        {renderEvent(featured)}
      </>}
      {upcomingOthers.length>0&&<div style={{marginTop:16}}>
        <button onClick={()=>setShowUpcoming(!showUpcoming)} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"10px 24px",color:"rgba(255,255,255,0.55)",fontSize:13,cursor:"pointer",fontFamily:"inherit",width:"100%"}}>
          📅 今後の試合 ({upcomingOthers.length}件) {showUpcoming?"▲":"▼"}
        </button>
        {showUpcoming&&<div style={{marginTop:8}}>{upcomingOthers.map(renderEvent)}</div>}
      </div>}
      {archive.length>0&&<div style={{marginTop:16}}>
        <button onClick={()=>setShowArchive(!showArchive)} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"10px 24px",color:"rgba(255,255,255,0.35)",fontSize:13,cursor:"pointer",fontFamily:"inherit",width:"100%"}}>
          📦 過去の試合 ({archive.length}件) {showArchive?"▲":"▼"}
        </button>
        {showArchive&&<div style={{marginTop:8}}>{archive.map(renderEvent)}</div>}
      </div>}
    </>}
    <div style={{marginTop:24,textAlign:"center"}}>
      <button onClick={()=>onNav("admin")} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"10px 24px",color:"rgba(255,255,255,0.35)",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>⚙️ 管理者メニュー</button>
    </div>
  </div>);
}

function EventScreen({event,roster,responses,lottery,onBack,onSubmit,onNav,onCarpoolAmida,onSaveCarpool,onOptimizeCarpool,teamMeta}){
  const er=getEventRoster(roster,event||{});
  const myKey="parkingApp_myId";
  const[memberId,setMemberId]=useState(()=>localStorage.getItem(myKey)||"");
  const[attending,setAttending]=useState(null);
  const[parking,setParking]=useState(null);
  const[carpool,setCarpool]=useState(0);
  const[meetingPoint,setMeetingPoint]=useState("");
  const[wish1,setWish1]=useState("");
  const[wish2,setWish2]=useState("");
  const[driverMpInput,setDriverMpInput]=useState("");
  const[loserWishes,setLoserWishes]=useState([]);
  const[savingCarpool,setSavingCarpool]=useState(false);
  const[err,setErr]=useState("");
  const[saving,setSaving]=useState(false);
  const[done,setDone]=useState(false);
  const[editing,setEditing]=useState(false);
  const[sectionOpen,setSectionOpen]=useState({yokou:true,parking:true,carpool:true});
  function toggleSection(k){setSectionOpen(s=>({...s,[k]:!s[k]}))}

  useEffect(()=>{
    const saved=localStorage.getItem(myKey);
    if(saved&&er.find(r=>r.id===saved)){
      setMemberId(saved);
      const prev=responses[saved];
      if(prev){
        setAttending(prev.attending);setParking(prev.parkingNeeded||false);setCarpool(prev.carpoolCapacity||0);
        setMeetingPoint(prev.meetingPoint||"");
        setWish1(prev.carpoolWishes?.[0]||"");setWish2(prev.carpoolWishes?.[1]||"");
        setDriverMpInput(prev.meetingPoint||"");
        setLoserWishes(prev.carpoolWishes||[]);
      }
    }
  },[event?.id]);

  if(!event)return null;
  const isPast=event.deadline&&new Date()>new Date(event.deadline);
  const tl=event.deadline&&!isPast?getTimeLeft(event.deadline):null;
  const limit=event.parkingLimit||0;
  const confirmed=getConfirmed(event);
  const lottSlots=getLotterySlots(event);
  const confirmedMembers=confirmed.map(id=>roster.find(r=>r.id===id)).filter(Boolean);
  const hopefuls=Object.entries(responses).filter(([id,r])=>r.attending&&r.parkingNeeded&&!confirmed.includes(id));
  const answered=Object.keys(responses).filter(id=>er.find(r=>r.id===id)).length;
  const unanswered=er.filter(r=>!responses[r.id]);
  const myResp=memberId?responses[memberId]:null;
  const isConfirmed=confirmed.includes(memberId);

  function selectMember(id){setMemberId(id);localStorage.setItem(myKey,id);
    const prev=responses[id];
    if(prev){
      setAttending(prev.attending);setParking(prev.parkingNeeded||false);setCarpool(prev.carpoolCapacity||0);
      setMeetingPoint(prev.meetingPoint||"");
      setWish1(prev.carpoolWishes?.[0]||"");setWish2(prev.carpoolWishes?.[1]||"");
      setDriverMpInput(prev.meetingPoint||"");
      setLoserWishes(prev.carpoolWishes||[]);
    }
    else{setAttending(null);setParking(null);setCarpool(0);setMeetingPoint("");setWish1("");setWish2("");setDriverMpInput("");setLoserWishes([])}
    setEditing(false);setDone(false);
  }

  async function doSubmit(){
    if(!memberId)return setErr("名前を選んでください");
    if(attending===null)return setErr("参加の有無を選んでください");
    if(attending&&!isConfirmed&&parking===null)return setErr("駐車場の希望を選んでください");
    setErr("");setSaving(true);
    const parkingNeeded=attending?(isConfirmed?true:parking):false;
    const cap=attending&&(isConfirmed||parking)?carpool:0;
    const payload={memberId,attending,parkingNeeded,carpoolCapacity:cap};
    await onSubmit(event.id,payload);
    setSaving(false);setDone(true);setEditing(false);
  }

  async function saveDriverMeetingPoint(){
    if(!driverMpInput.trim()){setErr("集合場所を入力してください");return}
    setErr("");setSavingCarpool(true);
    await onSaveCarpool(event.id,memberId,{meetingPoint:driverMpInput.trim()});
    setSavingCarpool(false);
  }
  async function saveLoserWishes(){
    setErr("");setSavingCarpool(true);
    await onSaveCarpool(event.id,memberId,{carpoolWishes:loserWishes.slice(0,2)});
    setSavingCarpool(false);
  }
  function toggleWish(mp){
    setLoserWishes(prev=>{
      if(prev.includes(mp))return prev.filter(x=>x!==mp);
      if(prev.length>=2)return [prev[1],mp];
      return [...prev,mp];
    });
  }

  function copyReminder(){
    const names=unanswered.map(r=>`#${r.num} ${r.name}`).join(", ");
    const url=window.location.href.split('#')[0];
    const details=fmtMatchDetails(event);
    const txt=`📢 回答のお願い\n━━━━━━━━━━━━\n📌 ${event.title}\n🗓 ${event.matchDate?fmtDate(event.matchDate):"未定"}${details?"\n"+details:""}\n⏰ 締切: ${event.deadline?fmtDateTime(event.deadline):"未設定"}\n━━━━━━━━━━━━\n📭 【未回答の方】\n ${names}\n━━━━━━━━━━━━\n👇 回答はこちらから\n${url}`;
    if(navigator.share){navigator.share({text:txt}).catch(()=>{})}
    else{navigator.clipboard.writeText(txt).then(()=>alert("コピーしました！LINEに貼り付けてください")).catch(()=>{
      const el=document.createElement("textarea");el.value=txt;el.style.position="absolute";el.style.left="-9999px";document.body.appendChild(el);el.select();document.execCommand("copy");document.body.removeChild(el);alert("コピーしました！LINEに貼り付けてください");
    })}
  }

  const showForm=!myResp||editing;
  const hasYokou=!!(event.opponent||event.location||event.meetTime||event.kickoffTime||event.endTime||event.uniformColor||event.notes||(event.attachments&&event.attachments.length));

  return(<div>
    <BackBar title={event.title} onBack={onBack} label="← 一覧"/>

    {hasYokou&&<Accordion title="📋 要項" open={sectionOpen.yokou} onToggle={()=>toggleSection("yokou")} accent="rgba(56,189,248,0.3)">
      {event.opponent&&event.opponent!==event.title&&<div style={{marginBottom:10}}>
        <div style={{fontSize:11,color:C.dim,marginBottom:2}}>🆚 対戦相手</div>
        <div style={{fontSize:15,fontWeight:700}}>{event.opponent}</div>
      </div>}
      {event.location&&<div style={{marginBottom:10}}>
        <div style={{fontSize:11,color:C.dim,marginBottom:2}}>📍 会場</div>
        <div style={{fontSize:15,fontWeight:700,marginBottom:8}}>{event.location}</div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>window.open(mapUrl(event.location),"_blank","noopener,noreferrer")} style={{...S.btnSm,flex:1}}>🗺 会場の地図</button>
          <button onClick={()=>window.open(parkingUrl(event.location),"_blank","noopener,noreferrer")} style={{...S.btnSm,flex:1}}>🅿️ 周辺の駐車場</button>
        </div>
      </div>}
      {(event.meetTime||event.kickoffTime||event.endTime)&&<div style={{marginBottom:10,display:"flex",gap:16,flexWrap:"wrap"}}>
        {event.meetTime&&<div><div style={{fontSize:11,color:C.dim}}>⏰ 集合</div><div style={{fontSize:15,fontWeight:700}}>{event.meetTime}</div></div>}
        {event.kickoffTime&&<div><div style={{fontSize:11,color:C.dim}}>🏆 キックオフ</div><div style={{fontSize:15,fontWeight:700}}>{event.kickoffTime}</div></div>}
        {event.endTime&&<div><div style={{fontSize:11,color:C.dim}}>🏁 終了予定</div><div style={{fontSize:15,fontWeight:700}}>{event.endTime}</div></div>}
      </div>}
      {event.uniformColor&&<div style={{marginBottom:10}}>
        <div style={{fontSize:11,color:C.dim,marginBottom:2}}>👕 ユニフォーム</div>
        <div style={{fontSize:15,fontWeight:700}}>{event.uniformColor}</div>
      </div>}
      {event.notes&&<div style={{marginBottom:10}}>
        <div style={{fontSize:11,color:C.dim,marginBottom:2}}>📝 備考</div>

            <select value={carpool} onChange={e=>setCarpool(Number(e.target.value))} style={S.select}>

    {unanswered.length>0&&<div style={{...S.card,marginTop:8}}>

    {(()=>{
      const plan=lottery?.carpoolPlan;
      const attendCount=Object.values(responses).filter(r=>r&&r.attending).length;
      if(!plan){
        return <div>
          <div style={{...S.card,background:"rgba(56,189,248,0.05)",borderColor:"rgba(56,189,248,0.3)"}}>

      const myIsDriver=memberId&&driverIds.includes(memberId);
      const myAssignedDriver=memberId&&!myIsDriver?Object.entries(plan.assignments||{}).find(([d,riders])=>riders.includes(memberId))?.[0]:null;
      const myIsUnassigned=memberId&&(plan.unassigned||[]).includes(memberId);
      return <>
        <div style={{...S.card,background:"rgba(147,197,253,0.05)",borderColor:"rgba(147,197,253,0.3)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontWeight:900,color:C.limeLight}}>🎯 配車プラン</div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>onOptimizeCarpool(event.id)} style={S.btnSm}>🔄 再計算</button>
              <button onClick={()=>{
                const L=[`🚙 配車プラン`,`📌 ${event.title}`,`🗓 ${event.matchDate?fmtDate(event.matchDate):"未定"}`];
                if(event.location){L.push(`📍 ${event.location}`);L.push(`🗺 ${mapUrl(event.location)}`)}
                L.push("━━━━━━━━━━━━");
                L.push(`✅ 参加可能: ${plan.coveredCount}/${plan.attendeeCount}名（${driverIds.length}台使用）`);
                L.push("");
                plan.selectedDrivers.forEach((d,i)=>{
                  const dm=roster.find(r=>r.id===d.id);if(!dm)return;
                  const mp=responses[d.id]?.meetingPoint;
                  const tm=responses[d.id]?.driverDepartTime;
                  L.push(`🚗 ${i+1}号車: #${dm.num} ${dm.name}（+${d.capacity}人乗合）`);
                  if(mp)L.push(`  📍 ${mp}${tm?` ${tm}`:""}`);
                  const riders=(plan.assignments||{})[d.id]||[];
                  if(riders.length){L.push(`  ✅ 乗車: `+riders.map(rid=>{const me=roster.find(r=>r.id===rid);return me?`#${me.num} ${me.name}`:""}).filter(Boolean).join(", "))}
                  L.push("");
                });
                if(plan.unassigned&&plan.unassigned.length){
                  L.push("⚠️ 未割当（参加できない可能性）");
                  plan.unassigned.forEach(id=>{const me=roster.find(r=>r.id===id);if(me)L.push(`  ・#${me.num} ${me.name}`)});
                }
                const txt=L.join("\n");
                if(navigator.share){navigator.share({text:txt}).catch(()=>{})}
                else{navigator.clipboard.writeText(txt).then(()=>alert("コピーしました！LINEに貼り付けてください")).catch(()=>{
                  const el=document.createElement("textarea");el.value=txt;el.style.position="absolute";el.style.left="-9999px";document.body.appendChild(el);el.select();document.execCommand("copy");document.body.removeChild(el);alert("コピーしました！");
                })}
              }} style={S.btnSm}>📋 LINE共有</button>
            </div>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <div style={{...S.stat,background:"rgba(147,197,253,0.1)"}}><div style={{fontSize:18,fontWeight:900,color:C.limeLight}}>{plan.coveredCount}<span style={{fontSize:11,color:C.dim}}>/{plan.attendeeCount}名</span></div><div style={{fontSize:11,color:C.muted}}>参加可能</div></div>
            <div style={S.stat}><div style={{fontSize:18,fontWeight:900,color:C.amber}}>{driverIds.length}<span style={{fontSize:11,color:C.dim}}>/{event.parkingLimit||0}台</span></div><div style={{fontSize:11,color:C.muted}}>使用駐車場</div></div>
            {plan.unassigned&&plan.unassigned.length>0&&<div style={S.stat}><div style={{fontSize:18,fontWeight:900,color:"#f87171"}}>{plan.unassigned.length}</div><div style={{fontSize:11,color:C.muted}}>未割当</div></div>}
          </div>
          {(()=>{const settings=getTeamSettings(teamMeta);const assignments=plan.assignments||{};return plan.selectedDrivers.map((d,i)=>{const dm=roster.find(r=>r.id===d.id);if(!dm)return null;
            const riders=assignments[d.id]||[];
            const dResp=responses[d.id]||{};
            const cost=computeDriverCost(event,settings,riders.length);
            return <div key={d.id} style={{background:"rgba(0,0,0,0.2)",borderRadius:12,padding:12,marginBottom:8}}>
              <div style={{fontSize:13,fontWeight:700,color:C.amber,marginBottom:6}}>🚗 {i+1}号車: #{dm.num} {dm.name}（+{d.capacity}人乗合）</div>
              {dResp.meetingPoint?<div style={{fontSize:12,color:C.limeLight,marginBottom:6}}>📍 {dResp.meetingPoint}{dResp.driverDepartTime?` ${dResp.driverDepartTime}`:""}</div>
                :myIsDriver&&memberId===d.id?<div style={{background:"rgba(245,158,11,0.1)",borderRadius:8,padding:8,marginBottom:6,fontSize:11,color:C.amber}}>↓ あなたの集合場所・出発時刻を登録してください</div>
                :<div style={{fontSize:11,color:C.dim,marginBottom:6}}>📍 集合場所未登録</div>}
              {myIsDriver&&memberId===d.id&&<div style={{marginBottom:8}}>
                <input value={driverMpInput} onChange={e=>setDriverMpInput(e.target.value)} placeholder="集合場所（例：○○駅 西口）" style={{...S.input,marginBottom:6,fontSize:13,padding:"8px 10px"}}/>
                <input type="time" value={dResp.driverDepartTime||""} onChange={e=>onSaveCarpool(event.id,memberId,{driverDepartTime:e.target.value})} style={{...S.input,colorScheme:"dark",marginBottom:6,fontSize:13,padding:"8px 10px"}}/>
                <button onClick={saveDriverMeetingPoint} disabled={savingCarpool} style={{...S.btnSm,background:C.amber,color:"#052e16",width:"100%"}}>{savingCarpool?"保存中...":"💾 集合場所を保存"}</button>
              </div>}
              {riders.length>0?<div>
                <div style={{fontSize:11,color:C.dim,marginBottom:4}}>🚙 乗車者（{riders.length}/{d.capacity}名）</div>
                {riders.map(rid=>{const m=roster.find(r=>r.id===rid);return m?<div key={rid} style={{fontSize:13,color:C.limeLight,marginBottom:2}}>・#{m.num} {m.name}{memberId===rid?" (あなた)":""}</div>:null})}
              </div>:<div style={{fontSize:11,color:C.dim}}>🚙 乗車者なし</div>}
              {cost&&riders.length>0&&<div style={{background:"rgba(56,189,248,0.08)",borderRadius:10,padding:10,marginTop:8,fontSize:12}}>
                <div style={{color:C.sky,fontWeight:700,marginBottom:4}}>💰 費用按分</div>
                <div style={{color:C.muted,fontSize:11,lineHeight:1.6}}>ガソリン代: {cost.gas.toLocaleString()}円{cost.toll>0?` ／ 高速: ${cost.toll.toLocaleString()}円`:""}{cost.handlingFee>0?` ／ 手間賃: ${cost.handlingFee.toLocaleString()}円`:""}</div>
                <div style={{color:C.muted,fontSize:11,marginTop:2}}>合計: <b style={{color:"#fff"}}>{cost.total.toLocaleString()}円</b></div>
                <div style={{marginTop:6,padding:"6px 10px",background:"rgba(56,189,248,0.15)",borderRadius:8,fontWeight:700,color:C.sky,fontSize:14}}>1人あたり: {cost.perPassenger.toLocaleString()}円 × {cost.numPassengers}名</div>
              </div>}
            </div>;
          })})()}
          {plan.unassigned&&plan.unassigned.length>0&&<div style={{background:"rgba(239,68,68,0.08)",borderRadius:12,padding:12,marginTop:8}}>
            <div style={{fontSize:12,color:"#f87171",fontWeight:700,marginBottom:6}}>⚠️ 未割当 {plan.unassigned.length}名（駐車場枠不足）</div>
            {plan.unassigned.map(id=>{const me=roster.find(r=>r.id===id);return me?<div key={id} style={{fontSize:12,color:C.muted}}>・#{me.num} {me.name}{memberId===id?" (あなた)":""}</div>:null})}
          </div>}
          {myAssignedDriver&&(()=>{const dm=roster.find(r=>r.id===myAssignedDriver);return dm?
            <div style={{background:"rgba(56,189,248,0.1)",borderRadius:12,padding:12,marginTop:8,border:"1px solid rgba(56,189,248,0.3)"}}>
              <div style={{fontSize:12,color:C.sky,fontWeight:700}}>📌 あなたは {dm.name}さんの車に乗車予定です</div>
              {responses[myAssignedDriver]?.meetingPoint&&<div style={{fontSize:12,color:C.muted,marginTop:4}}>📍 {responses[myAssignedDriver].meetingPoint}{responses[myAssignedDriver]?.driverDepartTime?` ${responses[myAssignedDriver].driverDepartTime}`:""}</div>}
            </div>:null;
          })()}
          {myIsUnassigned&&<div style={{background:"rgba(239,68,68,0.1)",borderRadius:12,padding:12,marginTop:8}}>
            <div style={{fontSize:12,color:"#f87171",fontWeight:700}}>⚠️ あなたは現状未割当です。試合に参加できない可能性があります。</div>
          </div>}
        </div>
      </>;
    })()}
    </Accordion>}
  </div>);
}
// ── ADMIN SCREEN ──
function AdminScreen({roster,events,allResponses,allLotteries,onSelectEvent,onSaveEvent,onDeleteEvent,onSaveRoster,onRunLottery,onReLottery,onResetResponses,onBack,onNav,teamId,teamMeta,onUpdateTeamName,onLeaveTeam,onUpdateTeamSettings}){
  const[tab,setTab]=useState("events");
  const[msg,setMsg]=useState("");
  const flash=m=>{setMsg(m);setTimeout(()=>setMsg(""),3000)};
  const[modal,setModal]=useState(null);
  function confirm(m){return new Promise(res=>{setModal({m,ok:()=>{setModal(null);res(true)},no:()=>{setModal(null);res(false)}})})}

  // Roster
  const[rosterRows,setRosterRows]=useState(null);
  const[rosterDirty,setRosterDirty]=useState(false);
  const inputRefs=useRef({});
  const endRef=useRef(null);
  const allGrades=[...new Set(roster.map(r=>r.grade||"4年"))].sort();

  useEffect(()=>{if(tab==="roster"&&rosterRows===null)setRosterRows(roster.map(r=>({...r})))},[tab,roster]);

  function addRow(){const nr={id:uid(),num:"",name:"",grade:allGrades[0]||"4年"};setRosterRows(r=>[...r,nr]);setRosterDirty(true);
    setTimeout(()=>{inputRefs.current[`num_${nr.id}`]?.focus();endRef.current?.scrollIntoView({behavior:"smooth"})},50)}
  function removeRow(id){setRosterRows(r=>r.filter(x=>x.id!==id));setRosterDirty(true)}
  function updateRow(id,f,v){setRosterRows(r=>r.map(x=>x.id===id?{...x,[f]:v}:x));setRosterDirty(true)}
  async function saveRoster(){const v=rosterRows.filter(r=>r.name.trim());if(!v.length)return flash("⚠️ 名前を入力");await onSaveRoster(v);setRosterDirty(false);flash("✅ 保存しました！")}
  function discardRoster(){setRosterRows(roster.map(r=>({...r})));setRosterDirty(false);flash("↺ 元に戻しました")}

  // Event edit
  const[editEv,setEditEv]=useState(null);
  const[evLimit,setEvLimit]=useState(5);
  const[evErr,setEvErr]=useState("");
  const[evDirty,setEvDirty]=useState(false);
  const[evConfirmed,setEvConfirmed]=useState([]);
  const[evGrades,setEvGrades]=useState([]);
  const[detailsOpen,setDetailsOpen]=useState(false);
  const[attName,setAttName]=useState("");
  const[attUrl,setAttUrl]=useState("");
  const[parseInput,setParseInput]=useState("");
  const[parseOpen,setParseOpen]=useState(false);
  const[parseFlash,setParseFlash]=useState("");

  useEffect(()=>{
    if(editEv){
      // 試合要項は必須項目を含むため、常に開く（折りたたみ可だがデフォルトは開）
      setDetailsOpen(true);
    }
  },[editEv?.id]);

  function startEdit(ev){setEditEv({...ev});setEvLimit(ev.parkingLimit||5);setEvConfirmed(ev.confirmedParking||[]);setEvGrades(ev.inviteGrades||[...allGrades]);setEvErr("");setEvDirty(false)}
  function startNew(){const id=uid();setEditEv({_new:true,id,title:"",matchDate:"",deadline:"",parkingLimit:5});setEvLimit(5);setEvConfirmed([]);setEvGrades([...allGrades]);setEvErr("");setEvDirty(false)}
  function updateEv(f,v){setEditEv(p=>({...p,[f]:v}));setEvDirty(true)}
  function toggleGrade(g){setEvGrades(p=>p.includes(g)?p.filter(x=>x!==g):[...p,g]);setEvDirty(true)}
  function toggleConfirmed(id){setEvConfirmed(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);setEvDirty(true)}

  async function saveEditEv(){
    if(!editEv.title.trim()){setEvErr("⚠️ タイトル（対戦相手 or リーグ戦名）を入力");return}
    if(!editEv.matchDate){setEvErr("⚠️ 試合日時を入力（必須）");return}
    if(!editEv.deadline){setEvErr("⚠️ 回答締切を入力（必須）");return}
    if(!(editEv.location||"").trim()){setEvErr("⚠️ 試合要項：会場を入力（必須）");setDetailsOpen(true);return}
    if(!editEv.meetTime){setEvErr("⚠️ 試合要項：集合時刻を入力（必須）");setDetailsOpen(true);return}
    if(!editEv.kickoffTime){setEvErr("⚠️ 試合要項：キックオフ時刻を入力（必須）");setDetailsOpen(true);return}
    if(evGrades.length===0){setEvErr("⚠️ 参加対象を選択");return}
    await onSaveEvent({...editEv,parkingLimit:evLimit,confirmedParking:evConfirmed,inviteGrades:evGrades,_new:undefined});
    setEditEv(null);setEvDirty(false);flash("✅ 保存しました！")}
  async function cancelEditEv(){if(evDirty){const ok=await confirm("編集を破棄しますか？");if(!ok)return}setEditEv(null);setEvErr("")}

  async function changeTab(t){
    if(t===tab)return;
    if(tab==="events"&&editEv&&evDirty){const ok=await confirm("編集を破棄しますか？");if(!ok)return;setEditEv(null)}

  async function saveSettings(){
    const cleaned={
      gasPrice:parseFloat(settingsDraft.gasPrice)||170,

    <div style={S.card}>
      <button onClick={()=>setParseOpen(o=>!o)} style={{background:"none",border:"none",color:"#fff",fontFamily:"inherit",width:"100%",textAlign:"left",cursor:"pointer",padding:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:13,color:C.limeLight,fontWeight:900}}>✨ LINE文を貼り付けて自動入力</div>
        <div style={{fontSize:14,color:C.dim}}>{parseOpen?"▲":"▼"}</div>
      </button>
      {parseOpen&&<div style={{marginTop:12}} className="fade-in">
        <p style={{fontSize:11,color:C.dim,marginBottom:8,lineHeight:1.5}}>コーチからの試合連絡（日時・対戦相手・会場・集合時刻・KO・ユニ等）をそのまま貼り付けて「解析」を押してください</p>
        <textarea value={parseInput} onChange={e=>setParseInput(e.target.value)} placeholder={"例：\n5/23(土) 9:00 KO\n会場：中央公園グラウンド\n対戦相手 鶴ヶ岡FC\n集合 8:00\n終了 11:00\nユニ：白"} rows={6} style={{...S.input,resize:"vertical",minHeight:90,fontFamily:"inherit",marginBottom:8}}/>
        {parseFlash&&<div style={{fontSize:12,color:parseFlash.startsWith("⚠️")?C.amber:C.limeLight,background:parseFlash.startsWith("⚠️")?"rgba(245,158,11,0.1)":"rgba(147,197,253,0.08)",border:`1px solid ${parseFlash.startsWith("⚠️")?"rgba(245,158,11,0.3)":"rgba(147,197,253,0.3)"}`,borderRadius:10,padding:"10px 12px",marginBottom:10,whiteSpace:"pre-line",lineHeight:1.6}}>{parseFlash}</div>}
        <Btn variant="yellow" onClick={()=>{

          keys.forEach(k=>updateEv(k,parsed[k]));
          // 試合要項アコーディオンを開いてユーザーが確認できるようにする
          setDetailsOpen(true);
          const labelMap={title:"📌 タイトル",matchDate:"📅 試合日時",opponent:"🆚 対戦相手",location:"📍 会場",meetTime:"⏰ 集合",kickoffTime:"🏆 KO",endTime:"🏁 終了",uniformColor:"👕 ユニ",notes:"📝 備考"};
          const labels=keys.map(k=>labelMap[k]||k).join(" / ");
          setParseFlash(`✅ ${keys.length}項目を自動入力しました\n${labels}\n下の「試合要項」をご確認のうえ、足りない項目があれば手動で入力してください。`);
        }}>✨ 解析して入力</Btn>

    </div>

    <div style={S.card}>

      <input value={editEv.title} onChange={e=>updateEv("title",e.target.value)} placeholder="例：鶴ヶ岡FC / ブロックリーグ" style={S.input} autoComplete="off"/>
      <p style={{fontSize:10,color:C.dim,marginTop:6,lineHeight:1.5}}>※ 単発試合は「相手チーム名」、リーグ戦・大会は「○○リーグ」を入力（複数試合の組み合わせは「備考」へ）</p>

          <input value={editEv.location||""} onChange={e=>updateEv("location",e.target.value)} placeholder="例：中央公園グラウンド" style={S.input} autoComplete="off"/>
        </div>
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:C.dim,marginBottom:4}}>⏰ 集合時刻 <span style={{color:"#f87171",fontWeight:700}}>※必須</span></div>
          <input type="time" value={editEv.meetTime||""} onChange={e=>updateEv("meetTime",e.target.value)} style={{...S.input,colorScheme:"dark"}}/>
        </div>
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:C.dim,marginBottom:4}}>🏆 キックオフ <span style={{color:"#f87171",fontWeight:700}}>※必須</span></div>
          <input type="time" value={editEv.kickoffTime||""} onChange={e=>updateEv("kickoffTime",e.target.value)} style={{...S.input,colorScheme:"dark"}}/>
        </div>
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:C.dim,marginBottom:4}}>🏁 終了予定（任意）</div>
          <input type="time" value={editEv.endTime||""} onChange={e=>updateEv("endTime",e.target.value)} style={{...S.input,colorScheme:"dark"}}/>
        </div>
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:C.dim,marginBottom:4}}>👕 ユニフォーム色（任意）</div>
          <input value={editEv.uniformColor||""} onChange={e=>updateEv("uniformColor",e.target.value)} placeholder="例：白 / 紺" style={S.input} autoComplete="off"/>
        </div>
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:C.dim,marginBottom:4}}>📝 備考</div>
          <textarea value={editEv.notes||""} onChange={e=>updateEv("notes",e.target.value)} placeholder="その他連絡事項" rows={3} style={{...S.input,resize:"vertical",minHeight:60,fontFamily:"inherit"}}/>
        </div>
        <div>
          <div style={{fontSize:11,color:C.dim,marginBottom:4}}>📎 資料リンク（Google ドライブ等の共有URL）</div>
          {(editEv.attachments||[]).map(a=><div key={a.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(255,255,255,0.06)",borderRadius:10,padding:"8px 12px",marginBottom:6}}>
            <a href={a.url} target="_blank" rel="noopener noreferrer" style={{color:C.limeLight,fontSize:13,textDecoration:"none",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>🔗 {a.name||"リンク"}</a>
            <button onClick={()=>updateEv("attachments",(editEv.attachments||[]).filter(x=>x.id!==a.id))} style={{background:"rgba(239,68,68,0.15)",border:"none",color:"rgba(248,113,113,0.7)",fontSize:14,cursor:"pointer",padding:"4px 10px",borderRadius:6,marginLeft:8}}>×</button>
          </div>)}
          <div style={{display:"flex",gap:6,marginTop:6,flexWrap:"wrap"}}>
            <input value={attName} onChange={e=>setAttName(e.target.value)} placeholder="表示名（例：試合要綱）" style={{...S.input,flex:"1 1 130px",fontSize:13,padding:"8px 10px"}} autoComplete="off"/>
            <input value={attUrl} onChange={e=>setAttUrl(e.target.value)} placeholder="https://..." style={{...S.input,flex:"1 1 130px",fontSize:13,padding:"8px 10px"}} autoComplete="off"/>
            <button onClick={()=>{
              if(!attUrl.trim()){alert("URLを入力してください");return}
              const next=[...(editEv.attachments||[]),{id:uid(),name:attName.trim()||"リンク",url:attUrl.trim()}];
              updateEv("attachments",next);setAttName("");setAttUrl("");
            }} style={{...S.btnSm,background:C.lime,color:"#052e16"}}>＋追加</button>
          </div>
          <div style={{fontSize:10,color:C.dim,marginTop:6,lineHeight:1.5}}>※ Googleドライブの場合は「リンクを知っている全員」共有に設定してから貼り付けてください</div>
        </div>
      </div>}
    </div>

    <div style={S.card}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>🎯 動作モード</div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",padding:10,borderRadius:12,background:(editEv.mode||"simple")==="simple"?"rgba(147,197,253,0.12)":"rgba(255,255,255,0.04)",border:(editEv.mode||"simple")==="simple"?"2px solid "+C.lime:"1px solid rgba(255,255,255,0.1)"}}>
          <input type="radio" name="evmode" checked={(editEv.mode||"simple")==="simple"} onChange={()=>updateEv("mode","simple")} style={{marginTop:3}}/>
          <div>
            <div style={{fontSize:13,fontWeight:700}}>機能1: シンプル（駐車場抽選のみ）</div>
            <div style={{fontSize:11,color:C.dim,marginTop:2,lineHeight:1.5}}>あみだくじで駐車場を抽選。乗合可能人数は表示するが、マッチングは行わない。落選者は保護者間で個別連絡</div>
          </div>
        </label>
        <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",padding:10,borderRadius:12,background:editEv.mode==="carpool"?"rgba(56,189,248,0.12)":"rgba(255,255,255,0.04)",border:editEv.mode==="carpool"?"2px solid "+C.sky:"1px solid rgba(255,255,255,0.1)"}}>
          <input type="radio" name="evmode" checked={editEv.mode==="carpool"} onChange={()=>updateEv("mode","carpool")} style={{marginTop:3}}/>
          <div>
            <div style={{fontSize:13,fontWeight:700}}>機能2: 乗合最適化（参加最大化）</div>
            <div style={{fontSize:11,color:C.dim,marginTop:2,lineHeight:1.5}}>駐車枠数 + 各車両の乗車可能人数から、参加人数が最大になる様に乗合車を自動選定。集合場所・時間・費用按分まで管理</div>
          </div>
        </label>
      </div>
    </div>

    {editEv.mode==="carpool"&&<div style={S.card}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>💰 費用算定（機能2 / 任意）</div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div>
          <div style={{fontSize:11,color:C.dim,marginBottom:4}}>🛣 往復距離（km）</div>
          <input type="number" min="0" step="0.1" value={editEv.roundTripKm||""} onChange={e=>updateEv("roundTripKm",e.target.value?parseFloat(e.target.value):"")} placeholder="例：50" style={S.input}/>
        </div>
        <div>
          <div style={{fontSize:11,color:C.dim,marginBottom:4}}>🚗 高速代（円・往復合計）</div>
          <input type="number" min="0" step="100" value={editEv.tollFee||""} onChange={e=>updateEv("tollFee",e.target.value?parseInt(e.target.value):"")} placeholder="例：2000" style={S.input}/>
        </div>
      </div>
      <p style={{fontSize:10,color:C.dim,marginTop:8,lineHeight:1.5}}>※ ガソリン代はチーム設定の「ガソリン単価」「燃費」と往復距離から自動計算されます</p>
    </div>}

    <ErrMsg msg={evErr}/>
    <Btn onClick={saveEditEv} style={{marginBottom:8}}>💾 保存する</Btn>
    <Btn variant="ghost" onClick={cancelEditEv}>キャンセル</Btn>
  </div>);

  return(<div>
    <BackBar title="⚙️ 管理者メニュー" onBack={handleBack} label="← TOP"/>
    <div style={{display:"flex",background:"rgba(0,0,0,0.3)",borderRadius:16,padding:4,gap:4,marginBottom:16,flexWrap:"wrap"}}>
      {TABS.map(([k,l])=><button key={k} onClick={()=>changeTab(k)} style={{flex:1,minWidth:60,padding:"10px 4px",fontSize:12,fontWeight:700,borderRadius:12,border:"none",cursor:"pointer",fontFamily:"inherit",background:tab===k?C.lime:"transparent",color:tab===k?"#052e16":"rgba(255,255,255,0.5)"}}>{l}</button>)}
    </div>
    <FlashMsg msg={msg}/>

    {tab==="events"&&<div>
      {events.length===0&&<p style={{textAlign:"center",color:C.dim,padding:"16px 0"}}>試合がまだありません</p>}
      {[...events].sort((a,b)=>new Date(b.matchDate||0)-new Date(a.matchDate||0)).map(ev=>{
        const resp=allResponses[ev.id]||{};const lott=allLotteries[ev.id];
        const confirmed=getConfirmed(ev);
        const hopefuls=Object.values(resp).filter(r=>r.attending&&r.parkingNeeded).filter((_,i,a)=>{const id=Object.keys(resp).find(k=>resp[k]===_);return!confirmed.includes(id)}).length;
        const lottSlots=getLotterySlots(ev);
        return(<div key={ev.id} style={S.card}>
          <div style={{...S.row,marginBottom:8}}>
            <div><div style={{fontWeight:900}}>{ev.title}</div>{ev.matchDate&&<div style={{color:C.limeLight,fontSize:12}}>{fmtDate(ev.matchDate)}</div>}</div>
            <button onClick={()=>startEdit(ev)} style={{background:"rgba(255,255,255,0.1)",border:"none",color:"#fff",fontSize:12,cursor:"pointer",borderRadius:8,padding:"6px 12px",fontFamily:"inherit"}}>✏️ 編集</button>
          </div>

            <Tag label={`回答 ${Object.keys(resp).length}名`} color="white"/>
            <Tag label={`希望 ${hopefuls}台`} color="amber"/>
            <Tag label={`上限 ${ev.parkingLimit}台`} color="sky"/>
            {confirmed.length>0&&<Tag label={`確定 ${confirmed.length}台`} color="sky"/>}
            {lott?.conducted&&<Tag label="抽選済み" color="lime"/>}
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {!lott?.conducted&&hopefuls>0&&<button onClick={()=>{onSelectEvent(ev.id);onRunLottery(ev.id)}} style={S.btnSmY}>🎰 抽選{hopefuls>lottSlots?`（${hopefuls}→${lottSlots}台）`:"（全員当選）"}</button>}
            {(()=>{const ds=getDropouts(ev,resp,lott);return ds&&ds.openSlots>0&&ds.eligibleLosers.length>0&&<button onClick={()=>{onSelectEvent(ev.id);onReLottery(ev.id)}} style={{...S.btnSmY,background:"#dc2626",color:"#fff"}}>🔄 再抽選（空き{ds.openSlots}枠）</button>})()}
            {lott?.conducted&&<button onClick={()=>{onSelectEvent(ev.id);onNav("results")}} style={S.btnSmO}>結果を見る</button>}
            <button onClick={()=>{
              const url=window.location.href.split('#')[0];
              const details=fmtMatchDetails(ev);
              const txt=`🏆 新しい試合のお知らせ\n━━━━━━━━━━━━\n📌 ${ev.title}\n🗓 ${ev.matchDate?fmtDateTime(ev.matchDate):"未定"}${details?"\n"+details:""}\n⏰ 締切: ${ev.deadline?fmtDateTime(ev.deadline):"なし"}\n━━━━━━━━━━━━\n👇 参加・駐車場の回答はこちら\n${url}`;
              if(navigator.share){navigator.share({text:txt}).catch(()=>{})}
              else{navigator.clipboard.writeText(txt).then(()=>alert("コピーしました！LINEに貼り付けてください")).catch(()=>{
